        // ============ FUNCIONES DE LOCAL STORAGE ============
        
        // Guardar datos de sesión en localStorage
        function saveSessionToLocalStorage(userData) {
            try {
                // Crear objeto con la información del usuario
                const sessionData = {
                    uid: userData.uid,
                    email: userData.email,
                    nombreCompleto: userData.nombreCompleto || userData.nombre || 'Usuario',
                    rol: userData.rol || 'user',
                    fechaInicioSesion: new Date().toISOString(),
                    emailVerified: userData.emailVerified || false,
                    // Guardar timestamp para expiración (24 horas)
                    expiresAt: new Date().getTime() + (24 * 60 * 60 * 1000)
                };
                
                // Guardar en localStorage
                localStorage.setItem('rsi_session', JSON.stringify(sessionData));
                
                // También guardar datos individuales para fácil acceso
                localStorage.setItem('userUID', userData.uid);
                localStorage.setItem('userEmail', userData.email);
                localStorage.setItem('userName', userData.nombreCompleto || userData.nombre || 'Usuario');
                localStorage.setItem('userRole', userData.rol || 'user');
                localStorage.setItem('sessionStart', new Date().toISOString());
                
                console.log('✅ Sesión guardada en localStorage');
                return true;
            } catch (error) {
                console.error('❌ Error al guardar en localStorage:', error);
                return false;
            }
        }

        // Obtener datos de sesión de localStorage
        function getSessionFromLocalStorage() {
            try {
                const sessionData = localStorage.getItem('rsi_session');
                if (sessionData) {
                    const parsedData = JSON.parse(sessionData);
                    
                    // Verificar si la sesión ha expirado (24 horas)
                    const now = new Date().getTime();
                    if (parsedData.expiresAt && now > parsedData.expiresAt) {
                        console.log('⚠️ Sesión expirada en localStorage');
                        clearSessionFromLocalStorage();
                        return null;
                    }
                    
                    return parsedData;
                }
                return null;
            } catch (error) {
                console.error('❌ Error al obtener de localStorage:', error);
                return null;
            }
        }

        // Limpiar datos de sesión de localStorage
        function clearSessionFromLocalStorage() {
            try {
                localStorage.removeItem('rsi_session');
                localStorage.removeItem('userUID');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userName');
                localStorage.removeItem('userRole');
                localStorage.removeItem('sessionStart');
                console.log('✅ Sesión eliminada de localStorage');
                return true;
            } catch (error) {
                console.error('❌ Error al limpiar localStorage:', error);
                return false;
            }
        }

        // Verificar si hay sesión activa en localStorage
        function hasActiveSessionInLocalStorage() {
            const session = getSessionFromLocalStorage();
            return session !== null;
        }

        // Obtener un valor específico de localStorage
        function getUserFromLocalStorage(key) {
            try {
                return localStorage.getItem(key) || null;
            } catch (error) {
                console.error(`❌ Error al obtener ${key} de localStorage:`, error);
                return null;
            }
        }

        // Función para guardar datos adicionales del colaborador
        function saveColaboradorDataToLocalStorage(colaboradorData) {
            try {
                if (colaboradorData) {
                    localStorage.setItem('colaboradorData', JSON.stringify(colaboradorData));
                    console.log('✅ Datos de colaborador guardados en localStorage');
                }
            } catch (error) {

            }
        }

        // Función para mostrar/ocultar contraseña
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showSessionLoading() {

        // Función para mostrar SweetAlert de sesión detectada
        function showSessionDetectedAlert(rol, nombreCompleto, email, uid) {
            const rolNames = {
                'admin': 'Administrador',
                'puntoVenta': 'Punto de Venta',
                'facturas': 'Operador de Facturas',
                'colaborador': 'Colaborador',
                'user': 'Usuario',
                'admincolaborador': 'Administrador de Colaboradores'
            };
            
            const rolDisplay = rolNames[rol] || rol;
            
            let timerInterval;
            Swal.fire({
                title: 'Sesión activa detectada',
                html: `
                    <div style="text-align: left; margin-bottom: 1rem;">
                        <p><strong>Nombre:</strong> ${nombreCompleto}</p>
                        <p><strong>Correo:</strong> ${email}</p>
                        <p><strong>Rol:</strong> ${rolDisplay}</p>
                        <p><strong>Estado:</strong> <span style="color: #28a745;">Sesión activa</span></p>
                    </div>
                    <p>Serás redirigido automáticamente en <strong id="countdown">3</strong> segundos...</p>
                `,
                icon: 'info',
                showConfirmButton: false,
                allowOutsideClick: false,
                allowEscapeKey: false,
                timer: 3000,
                didOpen: () => {
                    const timer = Swal.getPopup().querySelector("strong#countdown");
                    let timeLeft = 3;
                    timerInterval = setInterval(() => {
                        timeLeft--;
                        timer.textContent = timeLeft;
                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                        }
                    }, 1000);
                    
                    // Guardar en localStorage cuando se detecta sesión activa
                    const userData = {
                        uid: uid,
                        email: email,
                        nombreCompleto: nombreCompleto,
                        rol: rol,
                        emailVerified: true
                    };
                    saveSessionToLocalStorage(userData);
                },
                willClose: () => {
                    clearInterval(timerInterval);
                }
            }).then((result) => {
                if (result.dismiss === Swal.DismissReason.timer) {
                    redirectByRole(rol);
                }
            });
        }

        // Función para redirigir según el rol
        function redirectByRole(rol) {
            switch(rol) {
                case 'admin':
                    window.location.href = '/vista/nav-admin/dashAdmin.html';
                    break;
                case 'puntoVenta':
                    window.location.href = '/vista/nav-puntoVenta/inicio.html';
                    break;
                case 'facturas':
                    window.location.href = '/vista/nav-operadores/prueba_asistencia.html';
                    break;
                case 'colaborador':
                    window.location.href = '/vista/nav-mesa-operadores/asistencia/asistencia.html';
                    break;
                case 'user':
                    window.location.href = '/vista/nav-usuarios/inicio-usuario/inicio-usuario.html';
                    break;
                case 'admincolaborador':
                    window.location.href = '/vista/nav-mesa-admin/asistencia/asistencia.html';
                    break;
                default:
                    window.location.href = '/vista/nav-usuarios/dashUser.html';
            }
        }

        // Función para verificar si hay sesión activa y redirigir
        function checkActiveSession() {
            showSessionLoading(); // Mostrar loading mientras se verifica
            
            firebase.auth().onAuthStateChanged(async (user) => {
                if (user && user.emailVerified) {
                    try {
                        const userDoc = await firebase.firestore().collection('usuarios').doc(user.uid).get();
                        
                        if (userDoc.exists) {
                            const userData = userDoc.data();
                            const rol = userData.rol;
                            const nombreCompleto = userData.nombreCompleto || 'Usuario';
                            const email = user.email;
                            
                            // Verificar estado del colaborador si aplica
                            if (rol === 'colaborador' || rol === 'admincolaborador') {
                                const colaboradorDoc = await firebase.firestore().collection('colaboradores').doc(user.uid).get();
                                
                                if (colaboradorDoc.exists) {
                                    const colaboradorData = colaboradorDoc.data();
                                    
                                    if (colaboradorData.trabajo === 'Activo') {
                                        // Guardar datos de colaborador en localStorage
                                        saveColaboradorDataToLocalStorage(colaboradorData);
                                        
                                        // Ocultar loading y mostrar SweetAlert
                                        hideSessionLoading();
                                        showSessionDetectedAlert(rol, nombreCompleto, email, user.uid);
                                    } else {
                                        // Si está inactivo, cerrar sesión y mostrar mensaje
                                        await firebase.auth().signOut();
                                        clearSessionFromLocalStorage();
                                        hideSessionLoading();
                                        Swal.fire({
                                            title: 'Cuenta deshabilitada',
                                            text: 'Su cuenta ha sido deshabilitada. Por favor, póngase en contacto con el administrador.',
                                            icon: 'warning',
                                            confirmButtonText: 'Aceptar'
                                        });
                                    }
                                } else {
                                    // Si no existe en colaboradores, mostrar SweetAlert normalmente
                                    hideSessionLoading();
                                    showSessionDetectedAlert(rol, nombreCompleto, email, user.uid);
                                }
                            } else {
                                // Para otros roles, mostrar SweetAlert normalmente
                                hideSessionLoading();
                                showSessionDetectedAlert(rol, nombreCompleto, email, user.uid);
                            }
                        } else {
                            hideSessionLoading();
                        }
                    } catch (error) {
                        console.error('Error al verificar sesión activa:', error);
                        hideSessionLoading();
                    }
                } else {
                    hideSessionLoading(); // Ocultar loading si no hay sesión
                    // Verificar si hay sesión en localStorage pero no en Firebase
                    if (hasActiveSessionInLocalStorage()) {
                        console.log('⚠️ Hay sesión en localStorage pero no en Firebase');
                        clearSessionFromLocalStorage();
                    }
                }
            });
        }

        // Función para navegar entre formularios
        function setupFormNavigation() {
            // De registro a login
            document.getElementById('goToLogin')?.addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('signupForm').classList.remove('active');
                document.getElementById('loginForm').classList.add('active');
            });

            // De login a registro
            document.getElementById('goToSignup')?.addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('loginForm').classList.remove('active');
                document.getElementById('signupForm').classList.add('active');
            });
        }

        // Función para recuperación de contraseña
        function setupPasswordRecovery() {
            document.getElementById('forgotPasswordLink')?.addEventListener('click', function(e) {
                e.preventDefault();

                Swal.fire({
                    title: 'Recuperar contraseña',
                    input: 'email',
                    inputPlaceholder: 'Ingresa tu correo electrónico',
                    showCancelButton: true,
                    confirmButtonText: 'Enviar',
                    cancelButtonText: 'Cancelar',
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    preConfirm: async (email) => {
                        if (!email) {
                            Swal.showValidationMessage('Por favor, ingresa un correo válido');
                            return false;
                        }

                        try {
                            await firebase.auth().sendPasswordResetEmail(email);
                            return email;
                        } catch (error) {
                            Swal.showValidationMessage(`Error: ${error.message}`);
                            return false;
                        }
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire({
                            title: 'Correo enviado',
                            text: 'Se ha enviado un correo para restablecer tu contraseña. Revisa tu bandeja de entrada.',
                            icon: 'success'
                        });
                    }
                });
            });
        }

        // Función para manejar el registro
        async function handleSignup(fullName, email, password, confirmPassword, rol) {
            try {
                if (password !== confirmPassword) {
                    throw new Error('Las contraseñas no coinciden');
                }

                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Guardar información adicional en Firestore
                await firebase.firestore().collection('usuarios').doc(user.uid).set({
                    nombreCompleto: fullName,
                    email: user.email,
                    rol: rol,
                    fechaRegistro: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Enviar correo de verificación
                await user.sendEmailVerification();

                return user;
            } catch (error) {
                throw error;
            }
        }

        // Función para manejar el login
        async function handleLogin(email, password) {
            try {
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                if (!user.emailVerified) {
                    await firebase.auth().signOut();
                    clearSessionFromLocalStorage();
                    throw new Error('Por favor verifica tu correo electrónico antes de iniciar sesión');
                }

                const userDoc = await firebase.firestore().collection('usuarios').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    throw new Error('No se encontró información del usuario');
                }

                const userData = userDoc.data();
                const rol = userData.rol;

                // Guardar en localStorage inmediatamente
                const sessionUserData = {
                    uid: user.uid,
                    email: user.email,
                    nombreCompleto: userData.nombreCompleto || 'Usuario',
                    rol: rol,
                    emailVerified: user.emailVerified
                };
                saveSessionToLocalStorage(sessionUserData);

                // Verificar estado del colaborador si aplica
                if (rol === 'colaborador' || rol === 'admincolaborador') {
                    const colaboradorDoc = await firebase.firestore().collection('colaboradores').doc(user.uid).get();
                    
                    if (colaboradorDoc.exists) {
                        const colaboradorData = colaboradorDoc.data();
                        
                        if (colaboradorData.trabajo !== 'Activo') {
                            await firebase.auth().signOut();
                            clearSessionFromLocalStorage();
                            throw new Error('Su cuenta ha sido deshabilitada. Por favor, póngase en contacto con el administrador.');
                        }
                        
                        // Guardar datos de colaborador en localStorage
                        saveColaboradorDataToLocalStorage(colaboradorData);
                    }
                }

                return { rol, userData }; // Devolvemos también userData para verificar notificaciones
            } catch (error) {
                throw error;
            }
        }

        // Nueva función para redirigir según rol y estado de notificaciones
        function redirectAfterLogin(rol, userData) {
            // Verificar si existe el campo notificacionesHabilitadas
            const tieneNotificacionesConfiguradas = userData && userData.hasOwnProperty('notificacionesHabilitadas');
            
            console.log(`🔔 Usuario ${rol} - notificaciones configuradas: ${tieneNotificacionesConfiguradas}`);
            
            // Rutas base según el rol
            const rutas = {
                'colaborador': {
                    permisos: '/vista/nav-mesa-operadores/permisos/permisos.html',
                    asistencia: '/vista/nav-mesa-operadores/asistencia/asistencia.html'
                },
                'admincolaborador': {
                    permisos: '/vista/nav-mesa-admin/permisos/permisos.html',
                    asistencia: '/vista/nav-mesa-admin/asistencia/asistencia.html'
                }
            };
            
            // Si es colaborador o admin colaborador
            if (rol === 'colaborador' || rol === 'admincolaborador') {
                const ruta = rutas[rol];
                
                if (tieneNotificacionesConfiguradas) {
                    console.log(`✅ Redirigiendo a asistencia (${rol}) - notificaciones ya configuradas`);
                    window.location.href = ruta.asistencia;
                } else {
                    console.log(`⚠️ Redirigiendo a permisos (${rol}) - notificaciones no configuradas`);
                    window.location.href = ruta.permisos;
                }
            } else {
                // Para otros roles, usar la redirección original
                console.log(`🔄 Redirigiendo según rol original: ${rol}`);
                redirectByRole(rol);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si hay sesión activa
            checkActiveSession();

            // Configurar navegación entre formularios
            setupFormNavigation();

                    this.reset();

                    document.getElementById('loginForm').classList.add('active');

                } catch (error) {

                    switch(error.code) {

                    Swal.fire({
                        title: 'Error',

                    await firebase.auth().signOut();
                    clearSessionFromLocalStorage();
                    throw new Error('Su cuenta ha sido deshabilitada. Por favor, póngase en contacto con el administrador.');
                }
                
                // Guardar datos de colaborador en localStorage
                saveColaboradorDataToLocalStorage(colaboradorData);
            }
        }

        return { rol, userData }; // Devolvemos también userData para verificar notificaciones
    } catch (error) {
        throw error;
    }
}

// Nueva función para redirigir según rol y estado de notificaciones
function redirectAfterLogin(rol, userData) {
    // Verificar si existe el campo notificacionesHabilitadas
    const tieneNotificacionesConfiguradas = userData && userData.hasOwnProperty('notificacionesHabilitadas');
    
    console.log(`🔔 Usuario ${rol} - notificaciones configuradas: ${tieneNotificacionesConfiguradas}`);
    
    // Rutas base según el rol
    const rutas = {
        'colaborador': {
            permisos: '/vista/nav-mesa-operadores/permisos/permisos.html',
            asistencia: '/vista/nav-mesa-operadores/asistencia/asistencia.html'
        },
        'admincolaborador': {
            permisos: '/vista/nav-mesa-admin/permisos/permisos.html',
            asistencia: '/vista/nav-mesa-admin/asistencia/asistencia.html'
        }
    };
    
    // Si es colaborador o admin colaborador
    if (rol === 'colaborador' || rol === 'admincolaborador') {
        const ruta = rutas[rol];
        
        if (tieneNotificacionesConfiguradas) {
            console.log(`✅ Redirigiendo a asistencia (${rol}) - notificaciones ya configuradas`);
            window.location.href = ruta.asistencia;
        } else {
            console.log(`⚠️ Redirigiendo a permisos (${rol}) - notificaciones no configuradas`);
            window.location.href = ruta.permisos;
        }
    } else {
        // Para otros roles, usar la redirección original
        console.log(`🔄 Redirigiendo según rol original: ${rol}`);
        redirectByRole(rol);
    }
}

    // Actualizar el evento submit del login
    document.getElementById('loginFormElement')?.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            Swal.showLoading();
            
            const { rol, userData } = await handleLogin(email, password);
            
            try {
                const { subscribeUser } = await import("/push-subscribe.js");
                const user = firebase.auth().currentUser;
                if (user) {
                    await subscribeUser(user.uid);
                    console.log("🔔 Push subscribe completado para:", user.uid);
                }
            } catch (err) {
                console.error("❌ Error en push subscribe:", err);
            }

            Swal.fire({
                title: '¡Bienvenido!',
                text: 'Redirigiendo...',
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            });

            // Usar la nueva función de redirección
            setTimeout(() => {
                redirectAfterLogin(rol, userData);
            }, 1500);

        } catch (error) {
            let errorMessage = 'Error al iniciar sesión';
            
            switch(error.code) {
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                    errorMessage = 'Correo o contraseña incorrectos';
                    break;
                default:
                    errorMessage = error.message;
            }
            
            Swal.fire({
                title: 'Error',
                text: errorMessage,
                icon: 'error'
            });
            
            clearSessionFromLocalStorage();
        }
    });

    // También actualizar la función checkActiveSession para manejar la redirección automática
    // Actualizar la parte donde se muestra el SweetAlert de sesión detectada
    function showSessionDetectedAlert(rol, nombreCompleto, email, uid, userData) {
        const rolNames = {
            'admin': 'Administrador',
            'puntoVenta': 'Punto de Venta',
            'facturas': 'Operador de Facturas',
            'colaborador': 'Colaborador',
            'user': 'Usuario',
            'admincolaborador': 'Administrador de Colaboradores'
        };
        
        const rolDisplay = rolNames[rol] || rol;
        const tieneNotificaciones = userData && userData.hasOwnProperty('notificacionesHabilitadas');
        
        let timerInterval;
        Swal.fire({
            title: 'Sesión activa detectada',
            html: `
                <div style="text-align: left; margin-bottom: 1rem;">
                    <p><strong>Nombre:</strong> ${nombreCompleto}</p>
                    <p><strong>Correo:</strong> ${email}</p>
                    <p><strong>Rol:</strong> ${rolDisplay}</p>
                    <p><strong>Estado:</strong> <span style="color: #28a745;">Sesión activa</span></p>
                    ${rol === 'colaborador' || rol === 'admincolaborador' ? `
                        <p><strong>Notificaciones:</strong> 
                            <span style="color: ${tieneNotificaciones ? '#28a745' : '#ffc107'};">
                                ${tieneNotificaciones ? '✓ Configuradas' : '⚠️ Pendientes de configurar'}
                            </span>
                        </p>
                    ` : ''}
                </div>
                <p>Serás redirigido automáticamente en <strong id="countdown">3</strong> segundos...</p>
            `,
            icon: 'info',
            showConfirmButton: false,
            allowOutsideClick: false,
            allowEscapeKey: false,
            timer: 3000,
            didOpen: () => {
                const timer = Swal.getPopup().querySelector("strong#countdown");
                let timeLeft = 3;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    timer.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                    }
                }, 1000);
                
                const sessionUserData = {
                    uid: uid,
                    email: email,
                    nombreCompleto: nombreCompleto,
                    rol: rol,
                    emailVerified: true
                };
                saveSessionToLocalStorage(sessionUserData);
            },
            willClose: () => {
                clearInterval(timerInterval);
            }
        }).then((result) => {
            if (result.dismiss === Swal.DismissReason.timer) {
                // Usar la nueva función de redirección
                redirectAfterLogin(rol, userData);
            }
        });
    }
    // Actualizar la función checkActiveSession para pasar userData
    function checkActiveSession() {
        showSessionLoading();
        
        firebase.auth().onAuthStateChanged(async (user) => {
            if (user && user.emailVerified) {
                try {
                    const userDoc = await firebase.firestore().collection('usuarios').doc(user.uid).get();
                    
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        const rol = userData.rol;
                        const nombreCompleto = userData.nombreCompleto || 'Usuario';
                        const email = user.email;
                        
                        if (rol === 'colaborador' || rol === 'admincolaborador') {
                            const colaboradorDoc = await firebase.firestore().collection('colaboradores').doc(user.uid).get();
                            
                            if (colaboradorDoc.exists) {
                                const colaboradorData = colaboradorDoc.data();
                                
                                if (colaboradorData.trabajo === 'Activo') {
                                    saveColaboradorDataToLocalStorage(colaboradorData);
                                    hideSessionLoading();
                                    showSessionDetectedAlert(rol, nombreCompleto, email, user.uid, userData);
                                } else {
                                    await firebase.auth().signOut();
                                    clearSessionFromLocalStorage();
                                    hideSessionLoading();
                                    Swal.fire({
                                        title: 'Cuenta deshabilitada',
                                        text: 'Su cuenta ha sido deshabilitada. Por favor, póngase en contacto con el administrador.',
                                        icon: 'warning',
                                        confirmButtonText: 'Aceptar'
                                    });
                                }
                            } else {
                                hideSessionLoading();
                                showSessionDetectedAlert(rol, nombreCompleto, email, user.uid, userData);
                            }
                        } else {
                            hideSessionLoading();
                            showSessionDetectedAlert(rol, nombreCompleto, email, user.uid, userData);
                        }
                    } else {
                        hideSessionLoading();
                    }
                } catch (error) {
                    console.error('Error al verificar sesión activa:', error);
                    hideSessionLoading();
                }
            } else {
                hideSessionLoading();
                if (hasActiveSessionInLocalStorage()) {
                    console.log('⚠️ Hay sesión en localStorage pero no en Firebase');
                    clearSessionFromLocalStorage();
                }
            }
        });
    }
    // Verificar si ya hay sesión en localStorage al cargar la página
            const savedSession = getSessionFromLocalStorage();
            if (savedSession) {
                console.log('📱 Sesión encontrada en localStorage:', savedSession.email);
            }
        });
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/vista/css/img/logoApp.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSI Enterprise</title>

    <!-- Estilos para las alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="inicio-de-sesion.css">

    <!-- Firebase (necesario cargar antes de login.js) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

    <!-- Otros scripts necesarios -->
    <script src="/components/animacion-tres-lineas.js"></script>
</head>
<body>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-38F2DBG9HE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-38F2DBG9HE');
    </script>

    <!-- Navegación dinámica -->
    <script src="../recursosDinamicos/nav.js"></script>

    <!-- Overlay de carga para sesión detectada -->
    <div id="sessionLoadingOverlay" class="session-loading-overlay" style="display: none;">
        <div class="session-loading-content">
            <div class="loading-spinner"></div>
            <h3>Verificando sesión...</h3>
            <p>Espera un momento por favor</p>
        </div>
    </div>

    <!-- Contenedor principal -->
    <div class="auth-container-wrapper">
        <div class="auth-container">
            <div class="form-section">
                <!-- Formulario de Login -->
                <div id="loginForm" class="containerForm active">
                    <div class="form-header">
                        <div class="form-title-container">
                            <div class="icon-circle">
                                <i class="fas fa-user"></i>
                            </div>
                            <h2>Iniciar Sesión</h2>
                        </div>
                    </div>
                    <form id="loginFormElement">
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="Contraseña" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="forgot-password">
                            <a href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
                        </div>
                        <button type="submit" class="btn-primary">Ingresar</button>
                    </form>
                    <a href="#" class="form-link" id="goToSignup">¿No tienes cuenta? Regístrate</a>
                </div>

                <!-- Formulario de Registro -->
                <div id="signupForm" class="containerForm">
                    <div class="form-header">
                        <div class="form-title-container">
                            <div class="icon-circle">
                                <i class="fas fa-user-plus"></i>
                            </div>
                            <h2>Crear Cuenta</h2>
                        </div>
                    </div>
                    <form id="signupFormElement">
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="fullName" placeholder="Nombre completo" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="signupEmail" placeholder="Correo electrónico" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="signupPassword" placeholder="Contraseña" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <input type="hidden" name="rol" value="user">
                        <button type="submit" class="btn-primary">Registrarse</button>
                    </form>
                    <a href="#" class="form-link" id="goToLogin">¿Ya tienes cuenta? Inicia sesión</a>
                </div>
            </div>
            <div class="image-section"></div>
        </div>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.9/dist/sweetalert2.min.js"></script>

    <!-- Nuestro archivo con toda la lógica -->
    <script src="inicio-de-sesion.js"></script>

    <!-- Otros scripts dinámicos -->
    <script src="../recursosDinamicos/footer.js"></script>
    <script src="/vista/nav-mesa-operadores/js/guardar-ultima-pagina.js"></script>
</body>
</html>

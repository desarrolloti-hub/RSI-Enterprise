<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Contactos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.9/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="./contactos.css">
</head>
<body>

    <br><br><br>

    <div class="container container-custom mt-5">
        <h2 class="text-center mb-4 titulo-pagina">
            <i class="fas fa-envelope-open-text"></i> Mensajes de Contacto
        </h2>

        <div id="contactos-container" class="mensajes-grid mb-4">
            <div class="col-12 text-center p-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>
        </div>

        <div class="pagination-container card p-3 d-flex flex-row justify-content-between align-items-center">
            <button id="btnAnterior" class="btn btn-outline-secondary" disabled>
                <i class="fas fa-chevron-left"></i> Anterior
            </button>
            <span id="paginaActual" class="fw-bold">Página 1</span>
            <button id="btnSiguiente" class="btn btn-outline-secondary" disabled>
                Siguiente <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script src="../js/firebase-init.js"></script>
    <script src="../js/personalizacion-colores.js"></script>
    <script src="../js/navegacion-admin.js"></script>
    
    <script src="./contactos.js"></script>
    <script src="../js/particulas.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Ticket | RSI Enterprise</title>
    <link rel="stylesheet" href="finalizar-ticket.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase (versión compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-check-circle"></i> Finalizar Ticket</h1>
            <a href="../gestion-tickets/gestion-tickets.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Volver a Mis Tickets
            </a>
        </div>

        <div class="finish-ticket-container">
            <div class="ticket-info-card">
                <h3>Información del Ticket</h3>
                <div id="ticketInfo">
                    <p><strong>ID:</strong> <span id="ticketIdDisplay">Cargando...</span></p>
                    <p><strong>Título:</strong> <span id="ticketTitle">Cargando...</span></p>
                    <p><strong>Estado:</strong> <span id="ticketStatus">Cargando...</span></p>
                    <p><strong>Prioridad:</strong> <span id="ticketPriority">Cargando...</span></p>
                    <p><strong>Área:</strong> <span id="ticketArea">Cargando...</span></p>
                </div>
            </div>

            <form id="finishTicketForm" class="finish-form">
                <div class="form-group">
                    <label for="projectDescription">
                        <i class="fas fa-file-alt"></i> Descripción del proyecto finalizado
                    </label>
                    <textarea 
                        id="projectDescription" 
                        class="form-control" 
                        rows="8" 
                        minlength="10" 
                        maxlength="10000" 
                        placeholder="Describa en detalle el trabajo realizado (mínimo 10 caracteres, máximo 10,000 caracteres)"
                        required></textarea>
                    <div class="char-counter">
                        <span id="charCount">0</span>/10,000 caracteres
                    </div>
                </div>

                <div class="form-group">
                    <label for="imageUpload">
                        <i class="fas fa-images"></i> Subir evidencia (1-20 imágenes)
                    </label>
                    <input type="file" id="imageUpload" accept="image/*" class="form-control" multiple>
                    <small class="form-text text-muted">Puedes seleccionar entre 1 y 20 imágenes.</small>
                </div>

                <div class="image-preview-container" id="imagePreviewContainer">
                </div>

                <div class="form-actions">
                    <button type="button" class="cancel-btn" id="cancelBtn">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <!-- Botón Pausar Ticket que redirige a otra página -->
                    <button type="button" class="action-btn pause-btn" id="pauseRedirectBtn">
                        <i class="fas fa-pause"></i> Pausar Ticket
                    </button>
                    <button type="submit" class="action-btn confirm-btn">
                        <i class="fas fa-check"></i> Finalizar Ticket
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts adicionales -->
    <script src="/vista/nav-mesa-admin/js/navegacion-admin.js"></script>
    <script src="/vista/nav-mesa-admin/js/personalizacion-colores.js"></script>
    <script src="/vista/nav-mesa-admin/js/particulas.js"></script>
    <script src="/vista/nav-mesa-admin/js/guardar-ultima-pagina.js"></script>
    
    <!-- Script principal -->
    <script src="finalizar-ticket.js"></script>
</body>
</html>

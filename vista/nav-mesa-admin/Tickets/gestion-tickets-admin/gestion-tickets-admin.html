<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/vista/css/img/logoApp.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSI Enterprise - Gestión de Tickets</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gestion-tickets-admin.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
</head>
<body>
    <div class="main-c">
        <div class="header">
            <div class="header-title-container">
                <h2 class="title" style="color:#fff !important;">Gestión de Tickets</h2>
            </div>
            <div class="header-controls">
                <div class="filters-row">
                    <div class="filter-container">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Buscar en todos los campos...">
                    </div>
                    <div class="filter-container">
                        <i class="fas fa-user"></i>
                        <select id="collaboratorFilter" class="form-control">
                            <option value="">Filtrar por Colaborador</option>
                        </select>
                    </div>
                </div>
                
                <div class="filters-row date-filters-row" style="margin-top: 10px;">
                    <div class="filter-container">
                        <i class="fas fa-calendar-day"></i>
                        <select id="dayFilter" class="form-control">
                            <option value="">Todos los días</option>
                        </select>
                    </div>
                    <div class="filter-container">
                        <i class="fas fa-calendar-alt"></i>
                        <select id="monthFilter" class="form-control">
                            <option value="">Todos los meses</option>
                        </select>
                    </div>
                    <div class="filter-container">
                        <i class="fas fa-calendar"></i>
                        <select id="yearFilter" class="form-control">
                            <option value="">Todos los años</option>
                        </select>
                    </div>
                    <button id="clearDateFilters" class="btn btn-secondary" style="background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
                        <i class="fas fa-times"></i> Limpiar filtros
                    </button>
                </div>
                
                <div class="buttons-row" style="margin-top: 10px;">
                    <a href="../nuevo-ticket/nuevo-ticket.html" class="btn">
                        <i class="fas fa-plus"></i>
                        Nuevo Ticket
                    </a>
                    <button class="btn btn-danger" onclick="openTrash()">
                        <i class="fas fa-trash"></i>
                        Papelera
                    </button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table class="desktop-table">
                <thead>
                    <tr>
                        <th>ID Ticket</th>
                        <th>Colaboradores</th>
                        <th>Título</th>
                        <th>Estado</th>
                        <th>Prioridad</th>
                        <th>Área</th>
                        <th>Levantado por</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="ticketsTableBody">
                    <tr>
                        <td colspan="9" class="loading">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Cargando tickets...</p>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="mobile-cards" id="mobileCardsContainer"></div>
        </div> 
        
        <div class="pagination-container"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="gestion-tickets-admin.js"></script>
    <script src="pdf-generator.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/vista/nav-mesa-admin/js/navegacion-admin.js"></script>
    <script src="/vista/nav-mesa-admin/js/personalizacion-colores.js"></script>
    <script src="/vista/nav-mesa-admin/js/particulas.js"></script>
    <script src="/vista/nav-mesa-admin/js/guardar-ultima-pagina.js"></script>
</body>
</html>

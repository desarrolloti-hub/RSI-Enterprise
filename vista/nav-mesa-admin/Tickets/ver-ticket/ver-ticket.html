<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/vista/css/img/logoApp.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Ticket | RSI Enterprise</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="ver-ticket.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase V8 (compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <!-- Configuración de Firebase (cargará desde firebase-init.js) -->
    <script src="../js/firebase-init.js"></script>
    
    <!-- Estilos globales -->
    <style>
        /* Variables CSS que serán sobrescritas por personalizacion-colores.js */
        :root {
            --primary-color: #6C43E0;
            --secondary-color: #5a35c7;
            --accent-color: #8B5FEB;
            --background-color: #1a1a1a;
            --text-color: #f5f5f5;
            --card-bg: #2a2a2a;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div id="mensajeAcceso" style="display: none;"></div>
    <div id="particles-js"></div>

    <!-- Header -->
    <header class="ticket-header-page">
        <div class="header-container">
            <button class="back-btn" id="backBtn">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            <h1 id="pageTitle">Cargando Ticket...</h1>
            <div class="header-actions">
                <button class="action-btn history-btn" id="historyBtn">
                    <i class="fas fa-history"></i> Historial
                </button>
            </div>
        </div>
    </header>

    <main class="main-content-ticket">
        <div class="loading-container" id="loadingContainer">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
            <p>Cargando detalles del ticket...</p>
        </div>

        <div class="ticket-details-container" id="ticketDetailsContainer" style="display: none;">
            <!-- Contenido dinámico -->
        </div>

        <div class="error-container" id="errorContainer" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Error al cargar el ticket</h3>
            <p id="errorMessage"></p>
            <button class="action-btn retry-btn" id="retryBtn">
                <i class="fas fa-redo"></i> Reintentar
            </button>
        </div>
    </main>

    <!-- Modal para imágenes -->
    <div id="imageModal" class="modal" style="display: none;">
        <span class="close-modal" id="closeImageModal">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/vista/nav-mesa-admin/js/navegacion-admin.js"></script>
    <script src="/vista/nav-mesa-admin/js/personalizacion-colores.js"></script>
    <script src="/vista/nav-mesa-admin/js/particulas.js"></script>

    <script src="ver-ticket.js"></script>
</body>
</html>

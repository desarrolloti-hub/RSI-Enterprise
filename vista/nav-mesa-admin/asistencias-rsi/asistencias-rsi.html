<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/vista/css/img/logoApp.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Asistencias | Administrador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SheetJS para Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <!-- Firebase App (el core de Firebase) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link rel="stylesheet" href="asistencias-rsi.css">
</head>
<body>
    <!-- Main Content -->
    <div class="main-content">
        <header>
            <h1>Control de Asistencias</h1>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Buscar colaborador..." id="search-input">
                    <button id="search-button"><i class="fas fa-search"></i></button>
                </div>
                <button class="btn btn-filter" id="show-all-btn">
                    <i class="fas fa-list"></i> Ver todas
                </button>
                
            </div>
        </header>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label for="month">Mes</label>
                <select id="month">
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <div class="filter-group">
                <label for="year">Año</label>
                <select id="year">
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <div class="filter-group">
                <label for="quincena">Quincena</label>
                <select id="quincena">
                    <option value="1">1ra Quincena (1-15)</option>
                    <option value="2">2da Quincena (16-fin de mes)</option>
                </select>
            </div>
            <div class="filter-group" style="align-self: flex-end;">
                <button id="applyFilters" class="btn btn-primary">Aplicar Filtros</button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-cards">
            <div class="card">
                <div class="card-icon bg-primary">
                    <i class="fas fa-user-check"></i>
                </div>
                <div class="card-info">
                    <h3 id="weekly-attendance">0</h3>
                    <p>Colaboradores Activos</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon bg-success">
                    <i class="fas fa-building"></i>
                </div>
                <div class="card-info">
                    <h3 id="office-attendance">0</h3>
                    <p>Oficina Principal</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon bg-warning">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="card-info">
                    <h3 id="iztapaluca-attendance">0</h3>
                    <p>Oficina Iztapaluca</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon bg-danger">
                    <i class="fas fa-laptop-house"></i>
                </div>
                <div class="card-info">
                    <h3 id="onsite-attendance">0</h3>
                    <p>En Sitio</p>
                </div>
            </div>
        </div>

        <!-- Summary -->
        <div class="summary">
            <h3>Resumen de Asistencia - Quincena Seleccionada</h3>
            <div class="summary-grid">
                <div class="summary-item present-summary">
                    <h4>Días Presente</h4>
                    <div class="value" id="summary-present">0</div>
                </div>
                <div class="summary-item absent-summary">
                    <h4>Faltas</h4>
                    <div class="value" id="summary-absent">0</div>
                </div>
                <div class="summary-item late-summary">
                    <h4>Retardos</h4>
                    <div class="value" id="summary-late">0</div>
                </div>
                <div class="summary-item hours-summary">
                    <h4>Horas Trabajadas</h4>
                    <div class="value" id="summary-hours">0</div>
                </div>
            </div>
        </div>

        <!-- Mobile Cards View (visible solo en móvil) -->
        <div class="mobile-cards-view" id="mobileCardsView">
            <!-- Las tarjetas se generarán dinámicamente -->
        </div>

        <!-- Calendar Container (visible solo en desktop) -->
        <div class="calendar-container" id="calendarContainer">
            <div class="calendar-header">
                <h3 id="currentMonthYear">Enero 2025 - 1ra Quincena</h3>
            </div>
            <div class="calendar-wrapper">
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Calendar content will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="asistencias-rsi.js"></script>
    <!-- Scripts de personalización y navegación -->
    <script src="../js/personalizacion-colores.js"></script>
    <script src="../js/navegacion-admin.js"></script>
    <script src="../js/particulas.js"></script>

</body>
</html>

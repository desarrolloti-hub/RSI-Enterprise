<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Productos Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="gestion-de-productos.css">
</head>
<body>
    

    <div class="main-container">
        <header class="header-actions">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar productos..." oninput="filterProducts()">
            </div>
            <div class="button-group">
                <button class="btn-action" onclick="openProductForm()"><i class="fas fa-plus"></i> Agregar Producto</button>
            </div>
        </header>

        <div class="table-responsive">
            <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Desc.</th>
                    <th>Final</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>SKU</th>
                    <th>Acciones</th>
                </tr>
            </thead>
                <tbody id="productsBody">
                    </tbody>
            </table>
        </div>

        <div class="pagination-container">
            <button onclick="previousPage()"><i class="fas fa-chevron-left"></i> Anterior</button>
            <span id="pageNumber">Página 1</span>
            <button onclick="nextPage()">Siguiente <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

   <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script> <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../../js/personalizacion-colores.js"></script>
    <script src="../../js/particulas.js"></script>
    <script src="../../js/navegacion-admin.js"></script>

    <script src="gestion-de-productos.js"></script>
</body>
</html>

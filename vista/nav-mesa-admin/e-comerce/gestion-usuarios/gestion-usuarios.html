<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSI Enterprise - Gestión de Usuarios</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="gestion-usuarios.css">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="usuarios-container">
        <div class="usuarios-header">
            <h1><i class="fas fa-users"></i> Gestión de Usuarios</h1>
            <p>Administra los usuarios del sistema RSI Enterprise</p>
        </div>
        
        <div class="usuarios-content">
            <!-- Botones de acción -->
            <div class="usuarios-actions">
                <button class="btn-refresh" id="btnRefresh">
                    <i class="fas fa-sync-alt"></i> Actualizar
                </button>
                <button class="btn-export" id="btnExportExcel">
                    <i class="fas fa-file-excel"></i> Exportar Excel
                </button>
                <button class="btn-filtros" id="btnMostrarFiltros">
                    <i class="fas fa-filter"></i> Filtros
                </button>
            </div>
            
            <!-- Filtros (oculto por defecto) -->
            <div class="filtros-container" id="filtrosContainer" style="display: none;">
                <div class="filtros-content">
                    <div class="filtro-group">
                        <label><i class="fas fa-user"></i> Nombre</label>
                        <input type="text" id="filtroNombre" class="filtro-input" placeholder="Buscar por nombre...">
                    </div>
                    <div class="filtro-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="text" id="filtroEmail" class="filtro-input" placeholder="Buscar por email...">
                    </div>
                    <div class="filtro-group">
                        <label><i class="fas fa-calendar"></i> Fecha Inicio</label>
                        <input type="date" id="filtroFechaInicio" class="filtro-input">
                    </div>
                    <div class="filtro-group">
                        <label><i class="fas fa-calendar"></i> Fecha Fin</label>
                        <input type="date" id="filtroFechaFin" class="filtro-input">
                    </div>
                    <div class="filtro-acciones">
                        <button class="btn-aplicar-filtros" id="btnAplicarFiltros">
                            <i class="fas fa-check"></i> Aplicar
                        </button>
                        <button class="btn-limpiar-filtros" id="btnLimpiarFiltros">
                            <i class="fas fa-times"></i> Limpiar
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Contenedor para la tabla -->
            <div class="usuarios-list-container">
                <table class="usuarios-table">
                    <thead>
                        <tr>
                            <th><i class="fas fa-hashtag"></i> ID</th>
                            <th><i class="fas fa-user"></i> Nombre</th>
                            <th><i class="fas fa-envelope"></i> Correo</th>
                            <th><i class="fas fa-user-tag"></i> Rol</th>
                            <th><i class="fas fa-calendar-alt"></i> Fecha Registro</th>
                            <th><i class="fas fa-cog"></i> Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usuarios-lista">
                        <tr>
                            <td colspan="6" class="loading-state">
                                <i class="fas fa-spinner fa-spin"></i>
                                <p>Cargando usuarios...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Estadísticas -->
            <div class="usuarios-stats">
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <div class="stat-content">
                        <h3 id="totalUsuarios">0</h3>
                        <p>Usuarios totales</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-user-check"></i>
                    <div class="stat-content">
                        <h3 id="usuariosActivos">0</h3>
                        <p>Usuarios activos</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-user-clock"></i>
                    <div class="stat-content">
                        <h3 id="usuariosRecientes">0</h3>
                        <p>Registrados este mes</p>
                    </div>
                </div>
            </div>
            
            <!-- Paginación -->
            <div class="paginacion-container">
                <button class="btn-paginacion" id="btnAnterior" disabled>
                    <i class="fas fa-chevron-left"></i> Anterior
                </button>
                <span class="pagina-info" id="paginaInfo">Página 1 de 1</span>
                <button class="btn-paginacion" id="btnSiguiente" disabled>
                    Siguiente <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal para detalles -->
    <div class="modal-overlay" id="detalleModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-user-circle"></i> Detalles del Usuario</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-cancelar" id="closeModalBtn">
                    <i class="fas fa-times"></i> Cerrar
                </button>
                <button class="btn-modal btn-eliminar-usuario" id="eliminarUsuarioBtn">
                    <i class="fas fa-trash-alt"></i> Eliminar Usuario
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/vista/nav-mesa-admin/js/firebase-init.js"></script>
    <script src="/vista/nav-mesa-admin/js/personalizacion-colores.js"></script>
    <script src="/vista/nav-mesa-admin/js/particulas.js"></script>
    <script src="/vista/nav-mesa-admin/js/navegacion-admin.js"></script>
    <script src="/vista/nav-mesa-operadores/js/guardar-ultima-pagina.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="gestion-usuarios.js"></script>
</body>
</html>

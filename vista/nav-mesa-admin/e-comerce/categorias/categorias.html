<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSI Enterprise - Gestión de Categorías</title>
    
    <!-- Firebase SDK (DEBE IR PRIMERO) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="categorias.css">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="categorias-container">
        <div class="categorias-header">
            <h1><i class="fas fa-tags"></i> Gestión de Categorías</h1>
            <p>Administra las categorías de productos del sistema</p>
        </div>
        
        <div class="categorias-content">
            <!-- Botones de acción -->
            <div class="categorias-actions">
                <button class="btn-nueva-categoria" id="btnNuevaCategoria">
                    <i class="fas fa-plus"></i> Nueva Categoría
                </button>
                
                <a href="categoriasPapelera.html" class="btn-papelera">
                    <i class="fas fa-trash-alt"></i> Ver Papelera
                </a>
            </div>
            
            <!-- Contenedor para ambas vistas -->
            <div class="categorias-list-container">
                <!-- Vista Desktop: Tabla (visible en escritorio) -->
                <table class="categorias-table desktop-only">
                    <thead>
                        <tr>
                            <th><i class="fas fa-hashtag"></i> ID</th>
                            <th><i class="fas fa-tag"></i> Nombre</th>
                            <th><i class="fas fa-image"></i> Imagen</th>
                            <th><i class="fas fa-cog"></i> Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="categorias-lista">
                        <tr>
                            <td colspan="4" class="loading-state">
                                <i class="fas fa-spinner fa-spin"></i>
                                <p>Cargando categorías...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Vista Móvil: Tarjetas (visible en móvil) -->
                <div id="categorias-cards" class="categorias-cards-container"></div>
            </div>
            
            <!-- Estadísticas -->
            <div class="categorias-stats">
                <div class="stat-card">
                    <i class="fas fa-tags"></i>
                    <div class="stat-content">
                        <h3 id="totalCategorias">0</h3>
                        <p>Categorías activas</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-box"></i>
                    <div class="stat-content">
                        <h3 id="productosAsociados">0</h3>
                        <p>Productos asociados</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-trash-alt"></i>
                    <div class="stat-content">
                        <h3 id="categoriasPapelera">0</h3>
                        <p>En papelera</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Input oculto para subir imagen -->
    <input type="file" id="imagenUpload" accept="image/*" style="display: none;">

    <!-- Scripts -->
    <script src="/vista/nav-mesa-admin/js/firebase-init.js"></script>
    <script src="/vista/nav-mesa-admin/js/personalizacion-colores.js"></script>
    <script src="/vista/nav-mesa-admin/js/particulas.js"></script>
    <script src="/vista/nav-mesa-admin/js/navegacion-admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <script src="categorias.js"></script>
</body>
</html>

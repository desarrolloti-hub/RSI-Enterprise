<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSI Enterprise - Gestión de Contactos</title>
    
    <!-- Firebase SDK (DEBE IR PRIMERO) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="contactos.css">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="contactos-container">
        <div class="contactos-header">
            <h1><i class="fas fa-address-book"></i> Gestión de Contactos</h1>
            <p>Administra los mensajes recibidos desde el formulario de contacto</p>
        </div>
        
        <div class="contactos-content">
            <!-- Filtros y búsqueda -->
            <div class="contactos-filters">
                <div class="filter-group">
                    <label for="filterEstado"><i class="fas fa-filter"></i> Filtrar por estado:</label>
                    <select id="filterEstado" class="form-select">
                        <option value="todos">Todos los estados</option>
                        <option value="Sin contestar">Sin contestar</option>
                        <option value="Contestado">Contestado</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="searchContacto"><i class="fas fa-search"></i> Buscar:</label>
                    <input type="text" id="searchContacto" placeholder="Nombre, email o mensaje..." class="form-input">
                </div>
            </div>
            
            <!-- Contenedor de mensajes -->
            <div id="mensajesContainer" class="mensajes-container">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Cargando mensajes...</p>
                </div>
            </div>
            
            <!-- Paginación -->
            <div class="contactos-pagination">
                <button id="btnPaginaAnterior" class="btn-pagination" disabled>
                    <i class="fas fa-chevron-left"></i> Anterior
                </button>
                <span id="paginaActual" class="pagina-indicator">Página 1</span>
                <button id="btnPaginaSiguiente" class="btn-pagination" disabled>
                    Siguiente <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            
            <!-- Estadísticas -->
            <div class="contactos-stats">
                <div class="stat-card">
                    <i class="fas fa-envelope"></i>
                    <div class="stat-content">
                        <h3 id="totalMensajes">0</h3>
                        <p>Total mensajes</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-clock"></i>
                    <div class="stat-content">
                        <h3 id="pendientesMensajes">0</h3>
                        <p>Pendientes</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-circle"></i>
                    <div class="stat-content">
                        <h3 id="contestadosMensajes">0</h3>
                        <p>Contestados</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts (en orden correcto) -->
    <!-- Firebase SDK ya está cargado en el head -->
    <script src="/vista/nav-mesa-admin/js/firebase-init.js"></script>
    <script src="/vista/nav-mesa-admin/js/personalizacion-colores.js"></script>
    <script src="/vista/nav-mesa-admin/js/particulas.js"></script>
    <script src="/vista/nav-mesa-admin/js/navegacion-admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <script src="contactos.js" type="module"></script>
</body>
</html>

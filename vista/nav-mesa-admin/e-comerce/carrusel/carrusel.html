<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carruseles - RSI Enterprise</title>
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 para alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- CSS del carrusel -->
    <link rel="stylesheet" href="carrusel.css">
</head>
<body>
    <div class="main-c">
        <!-- Header con gradiente -->
        <header class="header">
            <div class="header-title-container">
                <h1 class="title">
                    <i class="fas fa-images"></i> Carruseles
                </h1>
            </div>
            
            <div class="header-controls">
              
                
                <div class="buttons-row">
                    <a href="nuevo-carrusel.html" class="btn btn-primary">
                        <i class="fas fa-plus"></i>
                        Nuevo Carrusel
                    </a>
                </div>
            </div>
        </header>

        <!-- Grid de carruseles -->
        <div class="carousels-grid" id="carouselsGrid">
            <!-- Los carruseles se cargarán dinámicamente -->
        </div>

        <!-- Paginación -->
        <div class="pagination-container" id="pagination" style="display: none;">
            <button class="pagination-btn" id="prevBtn" disabled>
                <i class="fas fa-chevron-left"></i>
            </button>
            <span class="page-info" id="pageInfo">Página 1 de 1</span>
            <button class="pagination-btn" id="nextBtn">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Modal para ver carrusel -->
    <div class="modal" id="carouselModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Carrusel</h2>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <!-- El carrusel se cargará dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Script del carrusel (sin cambios) -->
    <script src="carrusel.js"></script>
       <script src="/vista/nav-mesa-admin/js/navegacion-admin.js"></script>
    <script src="/vista/nav-mesa-admin/js/personalizacion-colores.js"></script>
    <script src="/vista/nav-mesa-admin/js/particulas.js"></script>
    <script src="/vista/nav-mesa-admin/js/guardar-ultima-pagina.js"></script>
</body>
</html>

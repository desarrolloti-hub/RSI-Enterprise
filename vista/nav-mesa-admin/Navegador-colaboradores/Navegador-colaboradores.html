<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalización de Navegación - RSI Enterprise</title>
    
    <!-- Estilos externos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../gestion-colaboradores/gestion-colaboradores.css">
    

</head>
<body>
    <!-- El menú lateral será cargado por navegacion-admin.js -->
    
    <div class="main-c">
        <div class="header">
            <div class="header-title-container">
                <h2 class="title"><i class="fas fa-compass"></i> Personalización de Navegación</h2>
            </div>
        </div>

        <!-- El contenedor se llenará dinámicamente -->
        <div id="navegacionPersonalizadaContainer">
            <div style="text-align: center; padding: 50px; color: #666;">
                <i class="fas fa-spinner fa-spin fa-3x"></i>
                <p>Cargando interfaz de personalización...</p>
            </div>
        </div>
    </div>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.9/dist/sweetalert2.min.js"></script>

    <!-- Scripts base -->
    <script src="../js/personalizacion-colores.js"></script>
    <script src="../js/navegacion-admin.js"></script>
    
    <!-- Script de personalización de navegación (con el nombre correcto) -->
    <script src="Navegador-colaboradores.js"></script>

    <!-- Scripts adicionales -->
    <script src="../js/particulas.js"></script>
    <script src="/vista/nav-mesa-operadores/js/guardar-ultima-pagina.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes del Sistema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./sistema-reportes.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fas fa-bug"></i> Reportes de Sistema</h1>
                <p style="color: #666; font-size: 0.9rem;">Gestión de errores y sugerencias de la plataforma.</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary" onclick="crearReporteDemo()">
                    <i class="fas fa-plus"></i> Nuevo Reporte
                </button>
                <button class="btn-secondary" onclick="window.history.back()">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
            </div>
        </div>
        <div>
                <h1><i class="fas fa-bug"></i> Reportes de Sistema</h1>
                <p style="color: #666; font-size: 0.9rem;">Gestión de errores y sugerencias de la plataforma.</p>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card danger">
                <h3>Pendientes</h3>
                <span id="countPending">0</span>
            </div>
            <div class="kpi-card warning">
                <h3>En Revisión</h3>
                <span id="countReview">0</span>
            </div>
            <div class="kpi-card success">
                <h3>Resueltos</h3>
                <span id="countSolved">0</span>
            </div>
        </div>

        <div class="table-wrapper">
            <table class="reports-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Tipo</th>
                        <th>Descripción</th>
                        <th>Evidencia</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="reportsTableBody">
                    <tr><td colspan="8" style="text-align:center;">Cargando sistema...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="../js/firebase-init.js"></script>
    <script src="../js/personalizacion-colores.js"></script>
    <script src="../js/navegacion-admin.js"></script>
    
    <script src="./sistema-reportes.js"></script>
</body>
</html>

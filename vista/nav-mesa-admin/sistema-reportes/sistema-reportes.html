<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Reportes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./sistema-reportes.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fas fa-tools"></i> Mesa de Reportes</h1>
                <p style="color: #666; font-size: 0.9rem;">Gestión técnica de incidencias.</p>
            </div>
            
            </div>

        <div class="kpi-grid">
            <div class="kpi-card danger">
                <h3>Pendientes</h3>
                <span id="countPending">--</span>
            </div>
            <div class="kpi-card warning">
                <h3>En Proceso</h3>
                <span id="countProcess">--</span>
            </div>
            <div class="kpi-card success">
                <h3>Resueltos</h3>
                <span id="countSolved">--</span>
            </div>
        </div>

        <div class="table-wrapper">
            <table class="reports-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Reportado Por</th>
                        <th>Módulo / Origen</th>
                        <th>Incidencia</th>
                        <th>Evidencia</th>
                        <th>Estado</th>
                        <th style="text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="reportsTableBody">
                    <tr><td colspan="7" style="text-align:center; padding: 20px;">Cargando base de datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="../js/filtrar-error.js"></script>
    <script src="../js/config/firebase-init.js"></script>
    <script src="../js/personalizacion-colores.js"></script>
    <script src="../js/navegacion-admin.js"></script>
    
    <script src="./sistema-reportes.js"></script>
            <script src="../js/particulas.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/vista/css/img/logoApp.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSI Enterprise - Gestión de Colaboradores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gestion-colaboradores.css">
</head>
<body>
    <!-- El menú lateral será cargado dinámicamente por navegacion-admin.js -->
    
    <div class="main-c">
        <div class="header">
            <div class="header-title-container">
                <h2 class="title" style="color:#fff !important;">Gestión de Colaboradores</h2>
            </div>
        </div>

        <!-- Controles de búsqueda y vista -->
        <div class="controls-container">
            <!-- Buscador -->
            <div class="search-container">
                <div class="filter-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar colaborador...">
                </div>
            </div>

            <!-- NUEVO: Filtros rápidos -->
            <div class="quick-filters">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-users"></i>
                    Todos
                </button>
                <button class="filter-btn" data-filter="activo">
                    <i class="fas fa-check-circle"></i>
                    Activos
                </button>
                <button class="filter-btn" data-filter="inactivo">
                    <i class="fas fa-times-circle"></i>
                    Inactivos
                </button>
            </div>

            <!-- Controles de vista -->
            <div class="view-controls">
                <button class="view-btn active" id="tableViewBtn">
                    <i class="fas fa-table"></i>
                    Vista Tabla
                </button>
                <button class="view-btn" id="cardViewBtn">
                    <i class="fas fa-th-large"></i>
                    Vista Tarjetas
                </button>
            </div>

            <!-- Botones de acción -->
            <div class="action-buttons">
                <a href="../nuevo-colaborador/nuevo-colaborador.html" class="btn">
                    <i class="fas fa-plus"></i>
                    Nuevo Colaborador
                </a>
            </div>
        </div>

        <div class="table-container">
            <!-- NUEVO: Contador de resultados -->
            <div class="results-counter" id="resultsCounter">
                Mostrando <span id="currentCount">0</span> de <span id="totalCount">0</span> colaboradores
            </div>

            <!-- TABLA PARA ESCRITORIO -->
            <table class="desktop-table" id="desktopTable">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nombre</th>
                        <th>Correo Empresarial</th>
                        <th>Área</th>
                        <th>Estado</th>
                        <th>Rol</th>
                        <th>Fecha Registro</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="usuariosTableBody">
                    <tr>
                        <td colspan="9" class="loading">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Cargando colaboradores...</p>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Grid de tarjetas para escritorio -->
            <div class="cards-grid" id="cardsGrid">
                <!-- Las tarjetas compactas se generarán dinámicamente -->
            </div>

            <!-- TARJETAS PARA MÓVIL -->
            <div class="mobile-cards" id="mobileCardsContainer" style="display: none;">
                <!-- Las tarjetas se generarán dinámicamente -->
            </div>
        </div>
    </div>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.9/dist/sweetalert2.min.js"></script>

    <!-- Scripts de navegación y personalización (dependencias) -->
    <script src="/vista/nav-mesa-admin/js/navegacion-admin.js"></script>
    <script src="/vista/nav-mesa-admin/js/personalizacion-colores.js"></script>
    <script src="/vista/nav-mesa-admin/js/particulas.js"></script>
    <script src="/vista/nav-mesa-admin/js/guardar-ultima-pagina.js"></script>

    <!-- Nuestro script principal de gestión de colaboradores -->
    <script src="gestion-colaboradores.js"></script>
</body>
</html>

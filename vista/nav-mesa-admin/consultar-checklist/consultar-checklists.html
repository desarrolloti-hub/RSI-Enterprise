<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Avanzada de Checklists</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Asegúrate de que este CSS sea el que contiene los estilos de tarjetas y filtros avanzados -->
    <link rel="stylesheet" href="./consultar-checklists.css"> 
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="container">
        <!-- Encabezado -->
        <div class="header">
            <h1><i class="fas fa-search"></i> Gestión de Historial checklist-automoviles</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="window.location.href='../checklist-automoviles/checklist-automoviles.html'">
                    <i class="fas fa-arrow-left"></i> Volver al Resumen
                </button>
            </div>
        </div>

        <!-- Filtros Avanzados -->
        <div class="filters-advanced">
            <h2>Filtros de Búsqueda</h2>
            <div class="filter-grid">
                <div class="filter-group">
                    <label for="filterDateStart">Fecha Inicio</label>
                    <input type="date" id="filterDateStart">
                </div>
                <div class="filter-group">
                    <label for="filterDateEnd">Fecha Fin</label>
                    <input type="date" id="filterDateEnd">
                </div>
                <div class="filter-group">
                    <label for="filterCollaborator">Colaborador</label>
                    <select id="filterCollaborator" class="custom-select" style="width: 100%;">
                        <option value="">Todos los colaboradores</option>
                        </select>
                </div>
                <div class="filter-group">
                    <label for="filterPlate">Placa</label>
                    <input type="text" id="filterPlate" placeholder="Placa...">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" id="btnApplyFilters" style="margin-top: 15px;">
                    <i class="fas fa-filter"></i> Aplicar Filtros
                </button>
                <button class="btn btn-secondary" id="btnClearFilters" style="margin-top: 15px;">
                    <i class="fas fa-sync-alt"></i> Limpiar Filtros
                </button>
            </div>
        </div>
        
        <!-- Contenedor de Resultados (Tabla/Grid) -->
        <div id="resultsContainer" class="checklists-grid" style="margin-top: 30px;">
            <div class="loading" style="grid-column: 1/-1;">
                <p>Presiona "Aplicar Filtros" para ver el historial.</p>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="../js/filtrar-error.js"></script>
    <script src="./consultar-checklists.js"></script>
    <script src="../js/navegacion-admin.js"></script>
    <script src="../js/personalizacion-colores.js"></script>
    <script src="../js/particulas.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Opiniones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.9/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="./comentarios.css">
</head>
<body>

    <br><br><br>

    <div class="container container-custom mt-5">
        <h2 class="text-center mb-4 titulo-pagina">
            <i class="fas fa-comments"></i> Opiniones de Clientes
        </h2>

        <div class="card mb-4 text-center p-3 resumen-card">
            <h4>Calificación Promedio</h4>
            <div class="display-4 fw-bold text-warning" id="comCalificacionPromedio">0.0</div>
            <div id="estrellas-promedio" class="text-warning fs-4">☆☆☆☆☆</div>
        </div>

        <div id="comOpiniones" class="opiniones-grid">
            <div class="col-12 text-center p-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script src="../js/firebase-init.js"></script>
    <script src="../js/filtrar-error.js"></script>
    <script src="../js/personalizacion-colores.js"></script>
    <script src="../js/navegacion-admin.js"></script>
    
    <script src="./comentarios.js"></script>
    <script src="../js/particulas.js"></script>

</body>
</html>

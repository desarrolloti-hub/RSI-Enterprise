<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Finalizados</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.9/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="./pedidos-finalizados.css">
</head>
<body>

    <br><br><br>

    <div class="container container-custom mt-5">
        
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4">
            <div>
                <h2 class="titulo-pagina mb-0"><i class="fas fa-check-circle"></i> Pedidos Finalizados</h2>
                <p class="text-muted small mb-0">Historial de órdenes completadas</p>
            </div>
            </div>

        <div class="table-responsive card p-0 mb-3">
            <table class="table table-hover mb-0" id="finalizadosTable">
                <thead>
                    <tr>
                        <th>ID Orden</th>
                        <th>Fecha Finalización</th>
                        <th>Cliente</th>
                        <th>Productos</th>
                        <th>Total</th>
                        <th>Sucursal</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="finalizados-body">
                    <tr>
                        <td colspan="8" class="text-center p-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-container card p-3 d-flex flex-row justify-content-between align-items-center">
            <button id="btnAnterior" class="btn btn-outline-secondary btn-sm" disabled>
                <i class="fas fa-chevron-left"></i> Anterior
            </button>
            <span id="paginaActual" class="fw-bold small">Página 1</span>
            <button id="btnSiguiente" class="btn btn-outline-secondary btn-sm" disabled>
                Siguiente <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script src="../js/firebase-init.js"></script>
    <script src="../js/personalizacion-colores.js"></script>
    <script src="../js/navegacion-admin.js"></script>
    
    <script src="./pedidos-finalizados.js"></script>
</body>
</html>

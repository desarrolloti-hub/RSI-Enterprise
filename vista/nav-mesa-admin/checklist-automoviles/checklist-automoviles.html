<!DOCTYPE html>
<html lang="es">
<head>
     <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/vista/css/img/logoApp.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Vehiculos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./checklist-automoviles.css">    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
</head>
<body>
    <body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-history"></i> Historial de checklists</h1>
            <div class="header-actions">
                <button class="btn-primary" id="btnCreateChecklist">
                <i class="fas fa-plus-circle"></i> Crear Checklist
                </button>
                <button class="btn-secondary" id="btnViewAll">
                    <i class="fas fa-list"></i> Consultar Todo
                </button>
            </div>
                
        </div>
        <div class="sort-box">
            <select id="limitSelect">
                <option value="5"> Ver ultimos 5 </option>
                <option value="10"> Ver ultimos 10 </option>
                <option value="15"> Ver ultimos 15 </option>
            </select>
        </div>
        
        <div id="checklistsContainer" class="checklists-grid">
            <!-- Los checklists se cargarán aquí dinámicamente -->
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando checklists...</p>
            </div>
        </div>
    </div>
    <div id="createChecklistFlow" class="create-flow" style="display:none;"></div>


    
        

<script src="./checklist-automoviles.js"></script>
<script src="../js/navegacion-admin.js"></script>
<script src="../js/personalizacion-colores.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Producto</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.9/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="./nuevo-producto.css">
</head>
<body>

    <br><br><br>

    <div class="container container-custom mt-5 mb-5 d-flex justify-content-center">
        
        <div class="registro-card-container w-100" style="max-width: 800px;">
            <form id="registro-producto-form" class="registro-card p-4">
                
                <div class="card-circle-icon">
                    <i class="fas fa-box-open"></i>
                </div>

                <h2 class="text-center mb-4 mt-4 titulo-form">Registro de Producto</h2>

                <div class="row g-3">
                    
                    <div class="col-md-6">
                        <label class="form-label">Nombre del Producto <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-box"></i></span>
                            <input type="text" id="nombreProducto" class="form-control" placeholder="Ej: Cámara IP Dome" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Categoría <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-list"></i></span>
                            <select id="categoria" class="form-select" required>
                                <option value="" selected disabled>Seleccione...</option>
                                </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Marca <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-tag"></i></span>
                            <input type="text" id="marca" class="form-control" placeholder="Ej: Dahua" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Modelo <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-barcode"></i></span>
                            <input type="text" id="modelo" class="form-control" placeholder="Ej: DH-IPC-HDBW" required>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Precio (MXN) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-dollar-sign"></i></span>
                            <input type="number" id="precio" class="form-control" placeholder="0.00" step="0.01" required>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">SKU <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-hashtag"></i></span>
                            <input type="text" id="sku" class="form-control" required>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Tipo</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-plug"></i></span>
                            <input type="text" id="tipo" class="form-control" placeholder="Ej: Hardware">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Estructura</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-layer-group"></i></span>
                            <input type="text" id="estructura" class="form-control" placeholder="Ej: Metálica">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Enlace del Producto</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-link"></i></span>
                            <input type="url" id="linkProducto" class="form-control" placeholder="https://...">
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Especificaciones</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-info-circle"></i></span>
                            <textarea id="especificaciones" class="form-control" rows="3" placeholder="Detalles técnicos..." required></textarea>
                        </div>
                    </div>

                    <div class="col-12 mt-4">
                        <h5 id="image-gallery-text" class="border-bottom pb-2 mb-3 text-primary">Imágenes del Producto <small class="text-muted fs-6">(Máx 3)</small></h5>
                        
                        <div class="image-gallery-container d-flex flex-wrap justify-content-center gap-3 mb-3" id="image-container">
                            <p class="text-muted small fst-italic w-100 text-center m-0 py-4">No hay imágenes seleccionadas</p>
                        </div>

                        <div class="text-center">
                            <button type="button" class="btn btn-outline-primary btn-sm" id="add-image-btn">
                                <i class="fas fa-plus-circle"></i> Agregar Imagen
                            </button>
                            <input type="file" id="file-input" accept="image/*" style="display: none;">
                        </div>
                    </div>

                </div>

                <div class="mt-5 pt-3 border-top">
                    <button type="submit" id="btn-guardar" class="btn btn-primary w-100 py-3 fw-bold fs-5">
                        Registrar Producto <i class="fas fa-save ms-2"></i>
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script src="../js/firebase-init.js"></script>
    <script src="../js/personalizacion-colores.js"></script>
    <script src="../js/navegacion-admin.js"></script>
    
    <script src="./nuevo-producto.js"></script>
</body>
</html>

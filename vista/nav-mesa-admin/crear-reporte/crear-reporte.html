<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Reporte de Sistema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./crear-reporte.css"> 

    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="report-container">
        <div class="report-header">
            <h2><i class="fas fa-bug"></i> Nuevo Reporte</h2>
            <p>Ayúdanos a mejorar. Describe el problema detalladamente.</p>
        </div>

        <form id="formReporte">
            <div class="context-box">
                <small><i class="fas fa-user-circle"></i> Reportando como:</small>
                <div id="userInfoDisplay" class="info-badge">Cargando usuario...</div>
                
                <small><i class="fas fa-map-marker-alt"></i> Origen del problema:</small>
                <input type="text" id="origenUrl" class="readonly-input" readonly placeholder="Detectando origen...">
            </div>

            <hr class="divider">

            <div class="form-row">
                <div class="form-group">
                    <label for="tipo">Tipo de Incidencia</label>
                    <select id="tipo" required>
                        <option value="Bug">🐛 Error de Sistema (Bug)</option>
                        <option value="UX">🎨 Diseño / Visual</option>
                        <option value="Mejora">💡 Sugerencia / Mejora</option>
                        <option value="Datos">💾 Problema de Datos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="prioridad">Prioridad Percibida</label>
                    <select id="prioridad">
                        <option value="Baja">🟢 Baja (No bloquea)</option>
                        <option value="Media" selected>🟡 Media (Molesto)</option>
                        <option value="Alta">🔴 Alta (Sistema bloqueado)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="modulo">Módulo / Pantalla Afectada</label>
                <input type="text" id="modulo" placeholder="Ej: Login, Facturación..." required>
                <span class="hint">El sistema intentó detectar esto arriba, pero puedes corregirlo aquí.</span>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción Detallada</label>
                <textarea id="descripcion" placeholder="1. ¿Qué intentabas hacer?&#10;2. ¿Qué esperabas que pasara?&#10;3. ¿Qué pasó realmente?" required></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="window.history.back()">Cancelar</button>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> Enviar Reporte
                </button>
            </div>

            <div id="screenshotPreviewArea" style="display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                <label style="display: block; margin-bottom: 10px;">
                    <strong><i class="fas fa-image"></i> Captura de Pantalla Adjunta:</strong>
                </label>
                
                <div style="position: relative; display: inline-block; border: 2px solid #6C43E0; border-radius: 8px; overflow: hidden;">
                    <img id="imgPreview" src="" alt="Captura de pantalla" style="max-width: 100%; height: auto; max-height: 200px; display: block;">
                    
                    <button type="button" id="btnRemoveScreenshot" style="position: absolute; top: 5px; right: 5px; background: rgba(220, 53, 69, 0.9); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">Esta imagen se enviará a los desarrolladores.</p>
                <input type="hidden" id="screenshotDataField">
            </div>
        </form>
    </div>

    <script src="../js/firebase-init.js"></script>
    <script src="../js/filtrar-error.js"></script>
    <script src="../js/navegacion-admin.js"></script>
    <script src="../js/personalizacion-colores.js"></script>
    <script src="./crear-reporte.js"></script>
        <script src="../js/particulas.js"></script>
 
</body>
</html>

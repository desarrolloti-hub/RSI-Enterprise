        // Generador de PDF (Funcionalidad Completa mantenida)
        class PDFGenerator {
            // ... (MANTENER LA CLASE PDFGenerator COMPLETA) ...
            constructor() {
                this.jsPDF = window.jspdf.jsPDF;
            }

            async generateTicketPDF(ticketData, evidencias) {
                try {
                    this.showProgressModal();
                    this.updateProgress(10, 'Inicializando generador PDF...');

                    const pdf = new this.jsPDF('p', 'mm', 'a4');
                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    let yPosition = 20;

                    this.updateProgress(20, 'Añadiendo header...');
                    await this.addHeader(pdf, pageWidth, yPosition);
                    yPosition += 40;

                    this.updateProgress(30, 'Añadiendo información básica...');
                    yPosition = this.addBasicInfo(pdf, ticketData, yPosition, pageWidth);

                    this.updateProgress(40, 'Añadiendo información adicional...');
                    yPosition = this.addAdditionalInfo(pdf, ticketData, yPosition, pageWidth);

                    this.updateProgress(50, 'Procesando evidencias...');
                    if (evidencias && evidencias.length > 0) {
                        for (let i = 0; i < evidencias.length; i++) {
                            this.updateProgress(50 + (i / evidences.length) * 40, 'Añadiendo evidencias...');
                            yPosition = await this.addEvidenceSection(pdf, evidencias[i], yPosition, pageWidth, pageHeight);
                        }
                    }

                    this.updateProgress(95, 'Finalizando PDF...');
                    
                    const pdfBase64 = pdf.output('datauristring');
                    await this.savePDFToFirebase(ticketData.id, pdfBase64);

                    this.updateProgress(100, 'PDF generado exitosamente');
                    
                    const fileName = `Ticket_${ticketData.id.substring(0, 8)}_${new Date().toISOString().split('T')[0]}.pdf`;
                    pdf.save(fileName);

                    setTimeout(() => {
                        this.hideProgressModal();
                        Swal.fire({
                            icon: 'success',
                            title: 'PDF Generado',
                            text: 'El PDF se ha generado y guardado exitosamente',
                            confirmButtonColor: '#3085d6'
                        });
                    }, 1000);

                } catch (error) {
                    console.error('Error generando PDF:', error);
                    this.hideProgressModal();
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'No se pudo generar el PDF: ' + error.message,
                        confirmButtonColor: '#3085d6'
                    });
                }
            }

            async addHeader(pdf, pageWidth, yPosition) {
                pdf.setFontSize(20);
                pdf.setFont('helvetica', 'bold');
                pdf.setTextColor(102, 126, 234);
                pdf.text('REPORTE DE TICKET - RSI ENTERPRISE', pageWidth / 2, yPosition, { align: 'center' });
                
                pdf.setDrawColor(102, 126, 234);
                pdf.setLineWidth(2);
                pdf.line(20, yPosition + 5, pageWidth - 20, yPosition + 5);
                
                pdf.setFontSize(10);
                pdf.setFont('helvetica', 'normal');
                pdf.setTextColor(100, 100, 100);
                pdf.text(`Generado el: ${new Date().toLocaleDateString('es-MX')} a las ${new Date().toLocaleTimeString('es-MX')}`, pageWidth - 20, yPosition + 15, { align: 'right' });
            }

            addBasicInfo(pdf, ticketData, yPosition, pageWidth) {
                const shortId = ticketData.id.substring(0, 8);
                
                pdf.setFontSize(14);
                pdf.setFont('helvetica', 'bold');
                pdf.setTextColor(44, 62, 80);
                pdf.text('INFORMACIÓN BÁSICA', 20, yPosition);
                yPosition += 10;

                const basicInfo = [
                    // Se mantiene el shortId en el PDF para consistencia, el ID completo se prioriza en la UI del modal
                    ['ID del Ticket:', `#${shortId.toUpperCase()}`], 
                    ['Título:', ticketData.titulo || 'Sin título'],
                    ['Estado:', (ticketData.estado || 'desconocido').replace('_', ' ').toUpperCase()],
                    ['Prioridad:', (ticketData.prioridad || 'media').toUpperCase()],
                    ['Área:', ticketData.area || 'General'],
                    ['Responsable:', ticketData.responsableNombre || 'No asignado'],
                    ['Fecha de Creación:', this.formatDate(ticketData.fechaCreacion)],
                    ['Última Actualización:', this.formatDate(ticketData.fechaActualizacion)],
                ];

                if (ticketData.fechaFinalizacion) {
                    basicInfo.push(['Fecha de Finalización:', this.formatDate(ticketData.fechaFinalizacion)]);
                }

                yPosition = this.addTable(pdf, basicInfo, yPosition, pageWidth);
                
                return yPosition + 10;
            }

            addAdditionalInfo(pdf, ticketData, yPosition, pageWidth) {
                if (ticketData.descripcionActividades) {
                    pdf.setFontSize(14);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setTextColor(44, 62, 80);
                    pdf.text('DESCRIPCIÓN DEL PROYECTO', 20, yPosition);
                    yPosition += 10;

                    pdf.setFontSize(10);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setTextColor(0, 0, 0);
                    
                    const splitDescription = pdf.splitTextToSize(ticketData.descripcionActividades, pageWidth - 40);
                    pdf.text(splitDescription, 20, yPosition);
                    yPosition += splitDescription.length * 5 + 10;
                }

                const additionalData = [];
                if (ticketData.servicio) additionalData.push(['Servicio:', ticketData.servicio]);
                if (ticketData.proyecto) additionalData.push(['Proyecto:', ticketData.proyecto]);
                if (ticketData.ordenServicio) additionalData.push(['Orden de Servicio:', ticketData.ordenServicio]);
                if (ticketData.rfc) additionalData.push(['RFC:', ticketData.rfc]);
                if (ticketData.direccionFiscal) additionalData.push(['Dirección Fiscal:', ticketData.direccionFiscal]);
                if (ticketData.cuenta) additionalData.push(['Cuenta:', ticketData.cuenta]);

                if (additionalData.length > 0) {
                    pdf.setFontSize(14);
                    pdf.setFont('helvetica', 'bold');
                    pdf.text('INFORMACIÓN ADICIONAL', 20, yPosition);
                    yPosition += 10;
                    
                    yPosition = this.addTable(pdf, additionalData, yPosition, pageWidth);
                    yPosition += 10;
                }

                return yPosition;
            }

            async addEvidenceSection(pdf, evidencia, yPosition, pageWidth, pageHeight) {
                if (yPosition > pageHeight - 50) {
                    pdf.addPage();
                    yPosition = 20;
                }

                pdf.setFontSize(14);
                pdf.setFont('helvetica', 'bold');
                pdf.setTextColor(44, 62, 80);
                pdf.text(`EVIDENCIAS DE: ${evidencia.colaboradorNombre}`, 20, yPosition);
                yPosition += 10;

                if (evidencia.descripcion) {
                    pdf.setFontSize(12);
                    pdf.setFont('helvetica', 'bold');
                    pdf.text('Descripción del trabajo realizado:', 20, yPosition);
                    yPosition += 8;

                    pdf.setFontSize(10);
                    pdf.setFont('helvetica', 'normal');
                    const splitDescription = pdf.splitTextToSize(evidencia.descripcion, pageWidth - 40);
                    pdf.text(splitDescription, 20, yPosition);
                    yPosition += splitDescription.length * 5 + 10;
                }

                if (evidencia.imagenes && evidencia.imagenes.length > 0) {
                    pdf.setFontSize(12);
                    pdf.setFont('helvetica', 'bold');
                    pdf.text(`Imágenes de evidencia (${evidencia.imagenes.length}):`, 20, yPosition);
                    yPosition += 10;

                    const imageWidth = 73; // 7.3 cm
                    const imageHeight = 100; // 10 cm
                    const imagesPerRow = 2;
                    let imageCount = 0;

                    for (const imageUrl of evidencia.imagenes) {
                        try {
                            if (yPosition + imageHeight > pageHeight - 20) {
                                pdf.addPage();
                                yPosition = 20;
                            }

                            const xPosition = 20 + (imageCount % imagesPerRow) * (imageWidth + 10);
                            
                            await this.addImageToPDF(pdf, imageUrl, xPosition, yPosition, imageWidth, imageHeight);
                            
                            imageCount++;
                            
                            if (imageCount % imagesPerRow === 0) {
                                yPosition += imageHeight + 10;
                            }
                        } catch (error) {
                            console.error('Error añadiendo imagen:', error);
                        }
                    }

                    if (imageCount % imagesPerRow !== 0) {
                        yPosition += imageHeight + 10;
                    }
                }

                return yPosition + 10;
            }

            async addImageToPDF(pdf, imageUrl, x, y, width, height) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    
                    img.onload = function() {
                        try {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            
                            canvas.width = width * 4; // Resolución más alta
                            canvas.height = height * 4;
                            
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                            
                            pdf.addImage(dataURL, 'JPEG', x, y, width, height);
                            resolve();
                        } catch (error) {
                            reject(error);
                        }
                    };
                    
                    img.onerror = () => reject(new Error('No se pudo cargar la imagen'));
                    img.src = imageUrl;
                });
            }

            addTable(pdf, data, yPosition, pageWidth) {
                const rowHeight = 8;
                const colWidth = (pageWidth - 40) / 2;

                data.forEach(([label, value]) => {
                    pdf.setFillColor(248, 249, 250);
                    pdf.rect(20, yPosition - 5, pageWidth - 40, rowHeight, 'F');
                    
                    pdf.setFontSize(10);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setTextColor(44, 62, 80);
                    pdf.text(label, 25, yPosition);
                    
                    pdf.setFont('helvetica', 'normal');
                    pdf.setTextColor(0, 0, 0);
                    const splitValue = pdf.splitTextToSize(value, colWidth - 10);
                    pdf.text(splitValue, 25 + colWidth, yPosition);
                    
                    yPosition += Math.max(rowHeight, splitValue.length * 5);
                });

                return yPosition;
            }

            formatDate(timestamp) {
                if (!timestamp || typeof timestamp.toDate !== 'function') return 'N/A';
                try {
                    const date = timestamp.toDate();
                    return date.toLocaleDateString('es-MX', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } catch (error) {
                    return 'Fecha inválida';
                }
            }

            async savePDFToFirebase(ticketId, pdfBase64) {
                try {
                    const pdfData = {
                        ticketId: ticketId,
                        nombreArchivo: `Ticket_${ticketId.substring(0, 8)}_${new Date().toISOString().split('T')[0]}.pdf`,
                        fechaCreacion: serverTimestamp(),
                        colaboradorId: AppState.userData.colaboradorId,
                        colaboradorNombre: AppState.userData.NOMBRE,
                        contenido: pdfBase64,
                        tamaño: Math.round(pdfBase64.length * 0.75)
                    };

                    await addDoc(collection(db, 'pdfMesa'), pdfData);
                    console.log('PDF guardado en Firebase exitosamente');
                } catch (error) {
                    console.error('Error guardando PDF en Firebase:', error);
                    throw error;
                }
            }

            showProgressModal() {
                Swal.fire({
                    title: 'Generando PDF',
                    html: `
                        <div class="pdf-progress" style="text-align: center;">
                            <i class="fas fa-file-pdf fa-3x" style="color: #e74c3c; margin-bottom: 20px;"></i>
                            <p>Inicializando...</p>
                            <div class="progress-bar" style="width: 100%; height: 10px; background: #333; border-radius: 5px; margin: 10px 0;">

                            </div>
                            <p id="swal-pdfProgressText">0%</p>
                        </div>
                    `,
                    allowOutsideClick: false,
                    showConfirmButton: false,
                    didOpen: () => Swal.showLoading()
                });
            }

            hideProgressModal() {
                Swal.close();
            }

            updateProgress(percentage, text) {
                const progressFill = document.getElementById('swal-pdfProgressFill');
                const progressText = document.getElementById('swal-pdfProgressText');
                const pElement = Swal.getHtmlContainer().querySelector('p');
                
                if (progressFill) progressFill.style.width = percentage + '%';
                if (progressText) progressText.textContent = Math.round(percentage) + '%';
                if (pElement && text) {
                    pElement.textContent = text;
                }
            }
        }

        // Instancia del generador de PDF
        const pdfGenerator = new PDFGenerator();

        // Funciones de utilidad (Optimizadas y Corregidas)
        const Utils = {

            formatDate: (timestamp) => {

                try {

                    return date.toLocaleDateString('es-MX', {
                        year: 'numeric',

            },

            formatDetailedDate: (timestamp) => {
                if (!timestamp || typeof timestamp.toDate !== 'function') return 'N/A';
                try {
                    const date = timestamp.toDate();
                    return date.toLocaleDateString('es-MX', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                } catch (error) {
                    return 'Fecha inválida';
                }
            },
            
            calculateAbandonmentTime: (creationTimestamp) => {
                if (!creationTimestamp || typeof creationTimestamp.toDate !== 'function') return { expired: true };

                const creationTime = creationTimestamp.toDate().getTime(); 
                const now = Date.now();
                const maxDuration = 5 * 24 * 60 * 60 * 1000; // 5 días en milisegundos
                const abandonmentTime = creationTime + maxDuration;
                let remainingTime = abandonmentTime - now;

                // ** LÓGICA DE PAUSA (3 DÍAS) **
                const pauseDuration = 3 * 24 * 60 * 60 * 1000; 
                
                // Si el ticket está en pausa, reiniciamos el contador por 3 días
                // Nota: Esta lógica es simplificada y asume que "en_proceso" es "pausa". 
                // La lógica de abandono ya compensa para que los tickets en pausa no expiren inmediatamente.
                // Aquí solo ajustamos el cálculo de tiempo *restante* visible en la UI.

                // Si está en pausa, extendemos el límite por 3 días
                if (ticketManager.currentTicketStatus === 'en_proceso') {
                    // Si está en pausa, el tiempo de abandono es 5 días + 3 días
                    remainingTime = (creationTime + maxDuration + pauseDuration) - now;
                } else if (remainingTime <= 0) {
                    return { expired: true };
                }


                const days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remainingTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));

                return {
                    expired: false,
                    days: days,
                    hours: hours,
                    minutes: minutes
                };
            },

            getBadgeClass: (status) => {

                        return 'badge-success';
                    case 'abandono_de_actividades':

                    case 'en_camino':

                    case 'pendiente': 
                    case 'pendiente_de_aceptación': 
                        return 'badge-danger';
                    case 'aceptado': 
                        return 'badge-info';
                    default: 
                        return 'badge-info';
                }
            },
            
            getStatusIcon: (status) => {
                switch(status) {
                    case 'finalizado':

                        return 'fa-check-circle';
                    case 'abandono_de_actividades': 
                        return 'fa-exclamation-triangle';
                    case 'en_proceso': 
                        return 'fa-pause-circle'; 
                    case 'en_camino': 
                        return 'fa-truck';
                    case 'pendiente': 
                    case 'pendiente_de_aceptación': 
                        return 'fa-clock';
                    case 'aceptado': 
                        return 'fa-check';
                    case 'cancelado': 
                        return 'fa-times-circle'; 
                    default: 
                        return 'fa-question-circle';
                }
            },
            
            getPriorityClass: (priority) => {
                switch(priority) {
                    case 'alta': return 'priority-high';
                    case 'media': return 'priority-medium';
                    case 'baja': return 'priority-low';
                    default: return 'priority-medium';
                }

            async showNotification(title, body, ticketId) {
                try {
                    if (!('Notification' in window)) {
                        console.log("Notificaciones no soportadas");
                        return false;
                    }

                    const permission = await Notification.requestPermission();
                    
                    if (permission === 'granted') {
                        if ('serviceWorker' in navigator) {
                            try {
                                const registration = await navigator.serviceWorker.ready;
                                
                                await registration.showNotification(title, {
                                    body: body,
                                    icon: 'https://rsienterprise.web.app/vista/css/img/logocon%20fondo.png',
                                    badge: 'https://rsienterprise.web.app/vista/css/img/logocon%20fondo.png',
                                    data: { 
                                        url: `https://rsienterprise.web.app/?ticketId=${ticketId}`,

        // Controlador de Tickets 
        const TicketsController = {
            processTickets: (querySnapshot) => {
                const tickets = [];
                querySnapshot.forEach((doc) => {
                    try {
                        const data = doc.data();
                        tickets.push({
                            id: doc.id,
                            ...data,
                            fechaCreacion: data.fechaCreacion,
                            fechaActualizacion: data.fechaActualizacion || null
                        });
                    } catch (error) {
                        console.error("Error procesando ticket:", error);
                    }
                });
                return tickets;
            },

            filterTickets: (tickets, showFinalized, selectedMonth) => {
                const finalizedStates = ['finalizado', 'cerrado', 'cancelado', 'completado', 'abandono_de_actividades']; 
                let filteredTickets;
                
                if (showFinalized) {
                    // 1. Filtrar por estados finalizados
                    filteredTickets = tickets.filter(ticket => finalizedStates.includes(ticket.estado));

                    // 2. Filtrar por mes (si está seleccionado)
                    if (selectedMonth) {
                        const [targetYear, targetMonth] = selectedMonth.split('-');
                        filteredTickets = filteredTickets.filter(ticket => {
                            if (ticket.fechaFinalizacion && typeof ticket.fechaFinalizacion.toDate === 'function') {
                                const date = ticket.fechaFinalizacion.toDate();
                                const ticketMonth = String(date.getMonth() + 1).padStart(2, '0');
                                const ticketYear = String(date.getFullYear());
                                return ticketYear === targetYear && ticketMonth === targetMonth;
                            }
                            return false;
                        });
                    }
                    
                    // 3. Ordenar por fechaFinalizacion (más reciente primero)
                    filteredTickets.sort((a, b) => {
                        const dateA = (a.fechaFinalizacion && typeof a.fechaFinalizacion.toDate === 'function') ? a.fechaFinalizacion.toDate().getTime() : 0;
                        const dateB = (b.fechaFinalizacion && typeof b.fechaFinalizacion.toDate === 'function') ? b.fechaFinalizacion.toDate().getTime() : 0;
                        return dateB - dateA; // Orden descendente (más reciente primero)
                    });

                } else {
                    // Mostrar tickets activos
                    filteredTickets = tickets.filter(ticket => !finalizedStates.includes(ticket.estado));
                }

                return filteredTickets;
            },

            // CORREGIDO: Usar el ID completo en el encabezado de la tarjeta
            renderTickets: (tickets) => {
                try {
                    const filteredTickets = TicketsController.filterTickets(tickets, ticketManager.showFinalized, ticketManager.selectedMonth);
                    DOM.ticketsContainer.innerHTML = '';
                    
                    // Lógica para mostrar/ocultar los filtros de finalizados
                    if (ticketManager.showFinalized) {
                        TicketsController.populateMonthFilter(tickets);
                        DOM.finalizedFilters.style.display = 'block';
                    } else {
                        DOM.finalizedFilters.style.display = 'none';
                    }
                    
                    if (!filteredTickets || filteredTickets.length === 0) {
                        const message = ticketManager.showFinalized 
                            ? (ticketManager.selectedMonth ? 'No tienes tickets finalizados en el mes seleccionado.' : 'No tienes tickets finalizados, cerrados o cancelados')
                            : 'No tienes tickets pendientes, aceptados o en proceso';
                            
                        DOM.ticketsContainer.innerHTML = `
                            <div class="no-tickets">
                                <i class="fas fa-ticket-alt"></i>
                                <h3>${message}</h3>
                                <p>Cuando ${ticketManager.showFinalized ? 'finalices' : 'te asignen'} tickets, aparecerán aquí</p>
                            </div>
                        `;
                        return;
                    }

                    let html = '';
                    filteredTickets.forEach(ticket => {
                        try {

                            // const shortId = ticketId.substring(0, 8); // Ya no se usa para el encabezado

                            const titulo = ticket.titulo || 'Sin título';

                                    <span class="badge badge-primary">
                                        <i class="fas fa-briefcase"></i> ${ticket.colaborador.puesto || 'Rsi Enterprice'}
                                    </span>
                                </div>
                            ` : '';
                            
                            html += `
                                <div class="ticket-card">
                                    <div class="ticket-header">
                                        <span class="ticket-id">#${ticketId.toUpperCase()}</span> 
                                        <span class="badge ${Utils.getBadgeClass(estado)}">
                                            <i class="fas ${Utils.getStatusIcon(estado)}"></i> ${estado.replace(/_/g, ' ')}
                                        </span>
                                    </div>
                                    <h3 class="ticket-title">${titulo}</h3>
                                    <p class="ticket-desc">${descripcion.substring(0, 120)}${descripcion.length > 120 ? '...' : ''}</p>
                                    
                                    <div class="ticket-meta">
                                        <span class="badge badge-primary">
                                            <span class="priority-indicator ${Utils.getPriorityClass(prioridad)}"></span>
                                            ${prioridad}
                                        </span>
                                        <span class="badge badge-primary">
                                            <i class="fas fa-layer-group"></i> ${area}
                                        </span>
                                    </div>
                                    
                                    ${colaboradorInfo}
                                    
                                    <div class="ticket-date">
                                        <i class="fas fa-calendar-alt"></i> ${Utils.formatDate(fechaCreacion)}
                                    </div>
                                    
                                    <button class="action-btn view" data-id="${ticketId}">
                                        <i class="fas fa-eye"></i> Ver detalles
                                    </button>
                                </div>

                            console.error("Error renderizando ticket:", error);

                    });
                    
                    DOM.ticketsContainer.innerHTML = html;
                    
                    document.querySelectorAll('.action-btn.view').forEach(btn => {
                        btn.addEventListener('click', () => TicketsController.showTicketDetails(btn.dataset.id));
                    });
                } catch (error) {
                    console.error("Error renderizando tickets:", error);
                    Utils.showError("Error al mostrar los tickets");
                }
            },

            populateMonthFilter: (tickets) => {
                const monthsMap = new Map();
                
                const finalizedTickets = tickets.filter(t => t.fechaFinalizacion && typeof t.fechaFinalizacion.toDate === 'function');

                finalizedTickets.forEach(ticket => {
                    const date = ticket.fechaFinalizacion.toDate();
                    const year = date.getFullYear();
                    const month = date.getMonth(); 
                    const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;
                    const monthName = date.toLocaleDateString('es-ES', { year: 'numeric', month: 'long' });

                    if (!monthsMap.has(monthKey)) {
                        monthsMap.set(monthKey, monthName);
                    }
                });

                const sortedMonths = Array.from(monthsMap.keys()).sort().reverse(); 

                let optionsHTML = '<option value="">Todos los Meses</option>';
                sortedMonths.forEach(key => {
                    const text = monthsMap.get(key);
                    optionsHTML += `<option value="${key}">${text}</option>`;
                });

                DOM.monthFilter.innerHTML = optionsHTML;
                
                if (ticketManager.selectedMonth) {
                    DOM.monthFilter.value = ticketManager.selectedMonth;
                }
            },


            async loadUserTickets() {
                try {
                    Utils.showLoading('Cargando tickets...');
                    
                    const user = firebase.auth().currentUser;
                    if (!user) {
                        throw new Error('Usuario no autenticado.');
                    }

                    const colaboradoresRef = collection(db, 'colaboradores');
                    const q2 = query(colaboradoresRef, where("CORREO ELECTRÓNICO EMPRESARIAL", "==", user.email));
                    const collabSnapshot = await getDocs(q2);
                    
                    if (collabSnapshot.empty) {
                        throw new Error('No se encontraron tus datos de colaborador en la base de datos.');
                    }
                    
                    collabSnapshot.forEach(doc => {
                        AppState.userData = doc.data();
                        AppState.userData.colaboradorId = doc.id;
                        AppState.userData.nombreCompleto = doc.data()['NOMBRE'];
                        AppState.userData.NOMBRE = doc.data()['NOMBRE']; 
                        AppState.userData.ÁREA = doc.data()['ÁREA']; 
                    });
                    
                    const ticketsRef = collection(db, 'ticketsmesa');
                    const nombreResponsable = AppState.userData.nombreCompleto;
                    const colaboradorId = AppState.userData.colaboradorId;
                    
                    let querySnapshot;
                    try {
                        const qResponsable = query(
                            ticketsRef,
                            where("responsableNombre", "==", nombreResponsable),
                            orderBy("fechaCreacion", "desc")
                        );
                        
                        const qColaborador = query(
                            ticketsRef,
                            where("colaboradores", "array-contains", colaboradorId),
                            orderBy("fechaCreacion", "desc")
                        );
                        
                        const [snapshotResponsable, snapshotColaborador] = await Promise.all([
                            getDocs(qResponsable),
                            getDocs(qColaborador)
                        ]);
                        
                        const allTickets = new Map();
                        snapshotResponsable.forEach(doc => { allTickets.set(doc.id, doc); });
                        snapshotColaborador.forEach(doc => { allTickets.set(doc.id, doc); });
                        
                        querySnapshot = {
                            docs: Array.from(allTickets.values()),
                            empty: allTickets.size === 0,
                            size: allTickets.size,
                            forEach: function(callback) { this.docs.forEach(doc => callback(doc)); }
                        };
                        
                    } catch (error) {
                        if (error.code === 'failed-precondition') {
                            const qResponsable = query(ticketsRef, where("responsableNombre", "==", nombreResponsable));
                            const qColaborador = query(ticketsRef, where("colaboradores", "array-contains", colaboradorId));
                            
                            const [snapshotResponsable, snapshotColaborador] = await Promise.all([
                                getDocs(qResponsable),
                                getDocs(qColaborador)
                            ]);
                            
                            const allTickets = new Map();
                            snapshotResponsable.forEach(doc => { allTickets.set(doc.id, doc); });
                            snapshotColaborador.forEach(doc => { allTickets.set(doc.id, doc); });
                            
                            querySnapshot = {
                                docs: Array.from(allTickets.values()),
                                empty: allTickets.size === 0,
                                size: allTickets.size,
                                forEach: function(callback) { this.docs.forEach(doc => callback(doc)); }
                            };
                        } else {
                            throw error;
                        }
                    }
                    
                    const tickets = this.processTickets(querySnapshot);
                    
                    const updatedTickets = await TicketsController.checkAndFlagAbandonedTickets(tickets);

                    const ticketsEnriquecidos = await this.enriquecerTicketsConColaborador(updatedTickets);
                    
                    AppState.allTickets = ticketsEnriquecidos;
                    this.renderTickets(ticketsEnriquecidos);
                    
                    if (updatedTickets.length > 0) {
                        AppState.lastCheckedTicketId = updatedTickets[0].id;
                    }
                    
                } catch (error) {
                    console.error("Error cargando tickets:", error);
                    Utils.showError("No se pudieron cargar los tickets. " + error.message);
                    DOM.ticketsContainer.innerHTML = `
                        <div class="no-tickets">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>Error al cargar tickets</h3>
                            <p>No se pudieron cargar los tickets: ${error.message}</p>
                        </div>
                    `;
                    if (error.message.includes('autenticado') || error.message.includes('colaborador')) {
                        window.location.replace('/vista/nav-visitantes/inicio-de-sesion.html');
                    }
                } finally {
                    Utils.hideLoading();
                }
            },
            
            async checkAndFlagAbandonedTickets(tickets) {
                const now = Date.now();
                const fiveDaysInMillis = 5 * 24 * 60 * 60 * 1000;
                const ticketsToUpdate = [];
                // Se incluye en_proceso aquí para que el contador no se dispare durante la pausa de 3 días.
                const nonActiveStatuses = ['finalizado', 'cerrado', 'cancelado', 'abandono_de_actividades', 'completado', 'en_proceso']; 

                for (const ticket of tickets) {
                    const status = ticket.estado;
                    const creationDate = (ticket.fechaCreacion && typeof ticket.fechaCreacion.toDate === 'function') ? ticket.fechaCreacion.toDate().getTime() : 0;

                    if (creationDate > 0 && 
                        (now - creationDate) >= fiveDaysInMillis && 
                        !nonActiveStatuses.includes(status)) 
                    {
                        ticketsToUpdate.push(ticket);
                    }
                }

                if (ticketsToUpdate.length > 0) {
                    console.log(`⚠️ Se encontraron ${ticketsToUpdate.length} tickets para marcar como abandono.`);
                    
                    const updatePromises = ticketsToUpdate.map(async (ticket) => {
                        const ticketRef = doc(db, 'ticketsmesa', ticket.id);
                        
                        await updateDoc(ticketRef, {
                            estado: 'abandono_de_actividades',
                            fechaActualizacion: serverTimestamp(),
                            fechaFinalizacion: serverTimestamp() 
                        });

                        await TicketsController.recordHistory(
                            ticket.id,
                            ticket.estado,
                            'abandono_de_actividades',
                            'Sistema: Abandono de actividades por inactividad de 5 días',
                            'SISTEMA',
                            'Sistema Automatizado'
                        );

                        ticket.estado = 'abandono_de_actividades';
                        ticket.fechaFinalizacion = serverTimestamp(); 
                    });

                    await Promise.all(updatePromises);
                    
                    Swal.fire({
                        icon: 'warning',
                        title: 'Tickets en Abandono',
                        text: `El sistema ha marcado ${ticketsToUpdate.length} tickets con más de 5 días sin cerrar como "Abandono de Actividades".`,
                        confirmButtonColor: '#3085d6'
                    });
                }

                return tickets;
            },


            async enriquecerTicketsConColaborador(tickets) {
                if (!tickets || tickets.length === 0 || !AppState.userData) return tickets;
                
                const datosColaborador = AppState.userData;
                    
                return tickets.map(ticket => ({
                    ...ticket,
                    colaborador: {
                        nombre: datosColaborador.NOMBRE,
                        area: datosColaborador.ÁREA,
                        puesto: datosColaborador.PUESTO,
                        imagen: datosColaborador.imagen || null
                    }
                }));
            },

            // CORREGIDO: Muestra el ID completo en el modal
            async showTicketDetails(ticketId) {
                try {
                    Utils.showLoading('Cargando detalles...');
                    
                    const ticketRef = doc(db, 'ticketsmesa', ticketId);

                    if (!ticketSnap.exists()) {
                        throw new Error('El ticket no existe');
                    }
                    
                    const data = ticketSnap.data();
                    // Usamos la cadena completa como ticketId y el inicio para shortId si es necesario
                    const shortId = ticketId.substring(0, 8); 
                    
                    ticketManager.setCurrentTicket(ticketId, data.estado);
                    
                    let nombresColaboradores = [];
                    if (data.colaboradores && data.colaboradores.length > 0) {
                        const colaboradoresPromises = data.colaboradores.map(async colabId => {
                            const colabRef = doc(db, 'colaboradores', colabId);
                            const colabSnap = await getDoc(colabRef);
                            return colabSnap.exists() ? { id: colabId, nombre: colabSnap.data().NOMBRE } : { id: colabId, nombre: 'Colaborador desconocido' };
                        });
                        nombresColaboradores = await Promise.all(colaboradoresPromises);
                    }
                    
                    const acceptanceHistoryMap = new Map();
                    try {
                        const historyRef = collection(db, 'historialTicket');
                        const acceptanceMotivos = [
                            "Colaborador individual aceptó el ticket.",

                            "Ticket aceptado por el último colaborador, cambiando estado a Aceptado."

                        const qAcceptance = query(
                            historyRef,
                            where("ticketId", "==", ticketId),
                            where("motivo", "in", acceptanceMotivos),
                            orderBy("fechaCambio", "asc")
                        );
                        const acceptanceSnap = await getDocs(qAcceptance);
                        
                        acceptanceSnap.forEach(doc => {
                            if (!acceptanceHistoryMap.has(doc.data().colaboradorId)) {
                                acceptanceHistoryMap.set(doc.data().colaboradorId, doc.data());
                            }
                        });

                        console.warn("Advertencia: No se pudo cargar el historial de aceptación (indice requerido):", error);
                    }


                    const evidenciasRef = collection(db, 'evidenciatickets');

                    editBtn.type = 'button';
                    editBtn.className = 'action-btn edit-btn';
                    editBtn.style.display = 'none';
                    editBtn.innerHTML = '<i class="fas fa-edit"></i> Modificar Finalización';


                    const userUid = AppState.userData.colaboradorId;

                    const usuarioYaCompleto = !!userEvidence;
                    const isPendingAcceptance = data.estado === 'pendiente_de_aceptación';

            async showTicketHistory(ticketId) {
                try {
                    Utils.showLoading('Cargando historial...');
                    
                    const historyRef = collection(db, 'historialTicket');
                    const q = query(
                        historyRef,
                        where("ticketId", "==", ticketId)
                    );
                    const historySnap = await getDocs(q);
                    
                    let historyDataArray = [];
                    historySnap.forEach(doc => {
                        historyDataArray.push(doc.data());
                    });

                    historyDataArray.sort((a, b) => {
                        try {
                            const dateA = (a.fechaCambio && typeof a.fechaCambio.toMillis === 'function') ? a.fechaCambio.toMillis() : 0;
                            const dateB = (b.fechaCambio && typeof b.fechaCambio.toMillis === 'function') ? b.fechaCambio.toMillis() : 0;
                            return dateB - dateA; 
                        } catch (e) {
                            return 0;
                        }
                    });

                    
                    let historyHTML = `
                        <style>
                            .history-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
                            .history-table th, .history-table td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
                            .history-table th { background-color: #f2f2f2; color: #333; font-weight: bold; }
                            .status-badge { padding: 4px 8px; border-radius: 12px; font-weight: bold; color: white; white-space: nowrap; }
                            .status-aceptado, .status-completado { background-color: #17a2b8; }
                            .status-pendiente_de_aceptación, .status-pendiente { background-color: #ffc107; color: #333; }
                            .status-en_proceso { background-color: #fd7e14; } 
                            .status-en_camino { background-color: #007bff; }
                            .status-abandono_de_actividades { background-color: #dc3545; } 
                            .status-cerrado, .status-finalizado { background-color: #28a745; }
                            .status-cancelado { background-color: #dc3545; }
                            .history-table td:nth-child(2) span,
                            .history-table td:nth-child(3) span { text-transform: capitalize; }
                            
                            /* CSS RESPONSIVE */
                            @media screen and (max-width: 768px) {
                                .history-table thead { display: none; }
                                .history-table tbody, .history-table tr { display: block; width: 100%; }
                                .history-table tr { margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 10px; }
                                .history-table td {
                                    display: block;
                                    text-align: right !important;
                                    padding-left: 50% !important; 
                                    position: relative;
                                    border-bottom: none;
                                }
                                .history-table td::before {
                                    content: attr(data-label);
                                    position: absolute;
                                    left: 10px;
                                    width: 45%;
                                    padding-right: 10px;
                                    white-space: nowrap;
                                    font-weight: bold;
                                    text-align: left;
                                    color: #e74c3c;
                                }
                                .history-table tr td:nth-of-type(1)::before { content: "Fecha/Hora:"; }
                                .history-table tr td:nth-of-type(2)::before { content: "Est. Anterior:"; }
                                .history-table tr td:nth-of-type(3)::before { content: "Est. Nuevo:"; }
                                .history-table tr td:nth-of-type(4)::before { content: "Colaborador:"; }
                                .history-table tr td:nth-of-type(5)::before { content: "Motivo:"; }
                                .history-table td span.status-badge { display: inline-block; white-space: normal; text-align: center; max-width: 100%; }
                            }
                        </style>
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>Fecha/Hora</th>
                                    <th>Estado Anterior</th>
                                    <th>Estado Nuevo</th>
                                    <th>Colaborador</th>

                    `;

            // Función centralizada para ACEPTAR TICKET
            async acceptTicket(ticketId) {
                try {
                    Utils.showLoading('Aceptando ticket...');

                    const userUid = AppState.userData.colaboradorId;
                    const ticketRef = doc(db, 'ticketsmesa', ticketId);
                    const ticketSnap = await getDoc(ticketRef);
                    const ticketData = ticketSnap.data();

                    if (!ticketData.colaboradores || !ticketData.colaboradores.includes(userUid)) {
                        throw new Error('No eres un colaborador asignado a este ticket.');
                    }

                    const currentAccepted = ticketData.colaboradoresAceptados || [];
                    if (currentAccepted.includes(userUid)) {
                        Utils.hideLoading();
                        Swal.fire({ icon: 'info', title: 'Ya Aceptado', text: 'Ya has aceptado este ticket.', confirmButtonColor: '#3085d6' });
                        return;
                    }
                    
                    const newAccepted = [...currentAccepted, userUid];
                    const totalColaboradores = ticketData.colaboradores.length;
                    const oldStatus = ticketData.estado;
                    
                    let newStatus = oldStatus;
                    let historyMotivo = `Colaborador individual aceptó el ticket.`;

                    // Lógica de transición de estado
                    if (oldStatus === 'pendiente_de_aceptación' || oldStatus === 'pendiente') {
                        if (newAccepted.length === totalColaboradores) {
                            // Si todos aceptaron (o es el único)
                            newStatus = 'aceptado';
                            historyMotivo = 'Ticket aceptado por el último colaborador, cambiando estado a Aceptado.';
                        } else {
                            // Si no es el último, el estado permanece en pendiente_de_aceptación, solo se registra la aceptación individual
                            newStatus = oldStatus; // Mantener el estado actual
                            historyMotivo = `Aceptación individual registrada (${newAccepted.length}/${totalColaboradores}).`;
                        }
                    } else if (oldStatus === 'aceptado') {
                        // Si ya estaba aceptado, solo se registra la aceptación individual.
                        historyMotivo = 'Aceptación individual registrada (el ticket ya estaba Aceptado).';
                    }

                    // 1. Actualizar el documento del ticket
                    await updateDoc(ticketRef, {
                        colaboradoresAceptados: newAccepted,
                        estado: newStatus,
                        fechaActualizacion: serverTimestamp(),
                        // Limpiar cualquier comentario de pausa residual si se acepta
                        pauseComment: '' 
                    });

                    // 2. Registrar en el historial de cambios de estado
                    await this.recordHistory(
                        ticketId,
                        oldStatus,
                        newStatus, 
                        historyMotivo,
                        userUid,
                        AppState.userData.NOMBRE
                    );
                    
                    Utils.hideLoading();
                    Swal.fire({
                        icon: 'success',
                        title: '¡Aceptación Registrada!',
                        text: newStatus === 'aceptado' ? 'El ticket ha sido Aceptado globalmente.' : 'Tu aceptación individual ha sido registrada.',
                        confirmButtonColor: '#3085d6'
                    });

                } catch (error) {
                    console.error('Error aceptando ticket:', error);
                    Utils.showError('No se pudo aceptar el ticket: ' + error.message);
                }
            },

            async checkForNewTickets() {
                try {
                    if (!AppState.userData || !AppState.userData.nombreCompleto) return false;
                    
                    const ticketsRef = collection(db, 'ticketsmesa');
                    const q = query(
                        ticketsRef,
                        where("responsableNombre", "==", AppState.userData.nombreCompleto),
                        where("notificacion", "==", false),
                        orderBy("fechaCreacion", "desc"),
                        limit(1)
                    );
                    
                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        const latestTicket = querySnapshot.docs[0];
                        const ticketId = latestTicket.id;
                        const ticketRef = doc(db, 'ticketsmesa', ticketId);
                        const ticketData = latestTicket.data();
                        
                        const notificationShown = await Utils.showNotification(
                            'Nuevo Ticket Asignado - RSI',
                            `Tienes un nuevo ticket: "${ticketData.titulo || 'Nuevo ticket sin título'}"`,
                            ticketId
                        );
                        
                        if (notificationShown) {
                            await updateDoc(ticketRef, {
                                notificacion: true
                            });
                            
                            AppState.lastCheckedTicketId = ticketId;
                            
                            // REGISTRO EN CONSOLA (Requerimiento de solo consola)
                            console.log(`✅ TICKET NUEVO DETECTADO: ID: ${ticketId.substring(0, 8)}, Título: "${ticketData.titulo}"`);
                            
                            return true;
                        }
                    }
                    return false;
                } catch (error) {
                    console.error("Error verificando nuevos tickets:", error);
                    return false;
                }
            },

            async recordHistory(ticketId, oldStatus, newStatus, motivo, collaboratorId, collaboratorName) {
                try {
                    const historyData = {
                        ticketId: ticketId,
                        fechaCambio: serverTimestamp(),
                        colaboradorId: collaboratorId,
                        colaboradorNombre: collaboratorName,
                        estadoAnterior: oldStatus,
                        estadoNuevo: newStatus,
                        motivo: motivo || `Cambio de estado de ${oldStatus} a ${newStatus}`
                    };
                    
                    await addDoc(collection(db, 'historialTicket'), historyData);
                    console.log('Historial de ticket registrado exitosamente.');
                } catch (error) {
                    console.error('Error registrando historial:', error);
                }
            },
            
            setupRealtimeListener() {
                if (AppState.unsubscribe) {
                    AppState.unsubscribe(); 
                }
                
                if (!AppState.userData || !AppState.userData.colaboradorId) {
                    console.log("No hay datos de usuario para configurar el listener en tiempo real.");
                    return;
                }

                const ticketsRef = collection(db, 'ticketsmesa');
                const collaboratorId = AppState.userData.colaboradorId;
                
                const q = query(
                    ticketsRef,
                    where("colaboradores", "array-contains", collaboratorId)
                );

                AppState.unsubscribe = onSnapshot(q, (snapshot) => {
                    console.log("🔥 Evento de cambio en tickets detectado. Recargando tickets...");
                    
                    if (Swal.isVisible() && ticketManager.currentTicketId && Swal.getTitle().textContent.includes(ticketManager.currentTicketId.substring(0, 8))) {
                        TicketsController.showTicketDetails(ticketManager.currentTicketId);
                    } else {
                        TicketsController.loadUserTickets(); 
                    }
                }, (error) => {
                    console.error("Error en el listener de tickets en tiempo real:", error);
                });

                console.log("✅ Listener de tickets en tiempo real configurado.");
            },
            
            setupTicketCheckInterval() {
                if (AppState.ticketCheckInterval) {
                    clearInterval(AppState.ticketCheckInterval);
                }
                AppState.ticketCheckInterval = setInterval(async () => {
                    await this.checkForNewTickets();
                    
                }, AppState.notificationCheckInterval);
            }
        };

        // Función de ayuda para obtener el color del estado
        function getStatusColor(status) {
            const colors = {
                'pendiente_de_aceptación': '#ffc107',
                'aceptado': '#17a2b8',
                'en_proceso': '#fd7e14', 
                'en_camino': '#007bff',
                'completado': '#28a745',
                'finalizado': '#28a745', 
                'cerrado': '#6c757d',
                'abandono_de_actividades': '#dc3545', 
                'cancelado': '#dc3545' 
            };
            return colors[status] || '#6c757d';
        }
            
        // ** LÓGICA DE INICIO DE LA APLICACIÓN **
        async function initializeAppLogic() {
            console.log('Inicializando lógica de la aplicación...');

            firebase.auth().onAuthStateChanged(async (user) => {
                if (user) {
                    console.log('👤 Usuario autenticado detectado en TicketsController:', user.email);
                    await TicketsController.loadUserTickets();
                    TicketsController.setupRealtimeListener(); 
                    TicketsController.setupTicketCheckInterval(); 
                } else {
                    console.log('🚫 No hay usuario autenticado. Redirigiendo...');
                    document.getElementById('mensajeAcceso').style.display = 'block';
                    document.getElementById('mensajeAcceso').innerHTML = `<div style="color: red; padding: 20px; text-align: center;">Acceso denegado. Redirigiendo...</div>`;
                    setTimeout(() => {
                        window.location.replace('/vista/nav-visitantes/inicio-de-sesion.html');
                    }, 3000);
                }
            });
        }


        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM cargado, configurando listeners...');
            
            // Configurar el filtro de tickets
            if (DOM.filterBtn) {
                DOM.filterBtn.addEventListener('click', () => {
                    const showFinalized = ticketManager.toggleFilter();
                    if (DOM.filterText) {
                        DOM.filterText.textContent = showFinalized ? 'Ver Activos' : 'Ver Finalizados';
                    }
                    
                    ticketManager.setSelectedMonth(null); 
                    if (DOM.monthFilter) {
                        DOM.monthFilter.value = "";
                    }
                    
                    if (AppState.allTickets.length > 0) {
                        TicketsController.renderTickets(AppState.allTickets);
                    }
                });
            }

            // Listener para el filtro por mes en la vista de finalizados
            if (DOM.applyMonthFilter) {
                DOM.applyMonthFilter.addEventListener('click', () => {
                    const selectedMonth = DOM.monthFilter.value;
                    ticketManager.setSelectedMonth(selectedMonth === "" ? null : selectedMonth);
                    if (AppState.allTickets.length > 0) {
                        TicketsController.renderTickets(AppState.allTickets);
                    }
                });
            }
            
            document.querySelectorAll('.close, .cancel-btn, #closeDetailBtn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    Swal.close();
                });
            });
            
            // ** INICIAR LA LÓGICA DE LA APLICACIÓN **
            initializeAppLogic();
            
            // Hacer Swal disponible globalmente
            window.Swal = Swal;
            window.TicketsController = TicketsController; 

            // Registrar Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('../../sw.js')
                        .then(registration => {
                            console.log('ServiceWorker registrado:', registration.scope);
                            navigator.serviceWorker.addEventListener('message', event => {
                                if (event.data && event.data.action === 'view') {
                                    TicketsController.showTicketDetails(event.data.ticketId);
                                }
                            });
                        })
                        .catch(error => {
                            console.log('Error al registrar ServiceWorker:', error);
                        });
                });
            }
        });

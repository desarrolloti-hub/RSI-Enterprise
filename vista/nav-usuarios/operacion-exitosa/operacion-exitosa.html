<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/vista/css/img/logoApp.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Exitosa | RSI Enterprise</title>
    <link rel="stylesheet" href="operacion-exitosa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body class="nan_reset">

    <script src="/javascripts/navScript.js"></script>
    <br><br>
    <!-- Contenido principal rediseñado -->
    <div class="main-content">
        <div class="success-container">
            <!-- Icono de éxito -->
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>

            <!-- Mensaje principal -->
            <h1>¡Operación Completada Exitosamente!</h1>
            <p>Gracias por tu compra. Hemos recibido tu operación y estamos procesando tu pedido.</p>
            <p>Recibirás un correo electrónico con los detalles de tu compra.</p>

            <!-- ID del pedido -->
            <div class="order-id" id="order-id-display">
                ID de tu pedido: Cargando...
            </div>

            <!-- Detalles de la compra -->
            <div class="order-details" id="order-details">
                <h3>Detalles de tu compra</h3>
                <!-- Los detalles se cargarán aquí dinámicamente -->
            </div>
            <!-- Botones -->
            <div class="button-group">
                <!-- Mantengo como botones para consistencia con tu ejemplo -->
                <button id="btn-continue" class="btn">
                    <i class="fas fa-home"></i> Volver al inicio
                </button>
                <button id="btn-historial" class="btn btn-outline">
                    <i class="fas fa-history"></i> Historial de compras
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Configuración Firebase - SOLO si no está ya inicializado
        const firebaseConfig = {
            apiKey: "AIzaSyBJy992gkvsT77-_fMp_O_z99wtjZiK77Y",
            authDomain: "rsienterprise.firebaseapp.com",
            projectId: "rsienterprise",
            storageBucket: "rsienterprise.appspot.com",
            messagingSenderId: "1063117165770",
            appId: "1:1063117165770:web:8555f26b25ae80bc42d033"
        };

        // Inicializar Firebase SOLO si no está inicializado
        let app, auth, db;
        
        try {
            // Intentar obtener la app existente
            app = firebase.app();
            console.log('✅ Firebase ya estaba inicializado, usando instancia existente');
        } catch (error) {
            // Si no existe, inicializarla
            console.log('🔄 Inicializando Firebase...');
            app = firebase.initializeApp(firebaseConfig);
        }
        
        // Obtener auth y db de la app (ya sea nueva o existente)
        auth = firebase.auth();
        db = firebase.firestore();
        
        console.log('🔥 Firebase listo:', {
            appName: app.name,
            auth: auth ? '✅' : '❌',
            db: db ? '✅' : '❌'
        });

        // Formatear fecha
        function formatDate(timestamp) {
            try {
                return timestamp.toDate().toLocaleDateString('es-MX', {
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (e) {
                return new Date().toLocaleDateString('es-MX');
            }
        }

        // Procesar parámetros de OpenPay
        async function processOpenPayResponse() {
            const urlParams = new URLSearchParams(window.location.search);
            const openpayId = urlParams.get('id');
            const orderId = urlParams.get('order_id');
            const status = urlParams.get('status');
            
            console.log('🔍 Parámetros URL:', { openpayId, orderId, status });
            
            if (!orderId || !status) {
                console.log('⚠️ No hay order_id o status en URL, devolviendo null');
                return null;
            }

            try {
                console.log('🔄 Actualizando orden en Firestore con datos de OpenPay:', orderId);
                
                const updateData = {
                    payment_status: status.toLowerCase(),
                    openpay_id: openpayId,
                    updated_at: firebase.firestore.FieldValue.serverTimestamp(),
                    payment_details: {
                        status: status,
                        transaction_id: openpayId,
                        processed_at: new Date().toISOString()
                    }
                };

                if (status.toLowerCase() === 'completed') {
                    updateData.status = 'completed';
                }

                await db.collection('orders').doc(orderId).update(updateData);
                console.log('✅ Orden actualizada exitosamente');
                
                return orderId;
            } catch (error) {
                console.error('❌ Error al actualizar con datos de OpenPay:', error);
                return orderId;
            }
        }

        // Mostrar detalles principales - CON MÁS DEBUG
        async function displayOrderDetails() {
            console.log('=== 🚀 INICIANDO displayOrderDetails ===');
            
            // Mostrar localStorage actual
            console.log('📋 Estado del localStorage:');
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                console.log(`  ${key}:`, localStorage.getItem(key));
            }
            
            try {
                // Procesar primero la respuesta de OpenPay si existe
                const updatedOrderId = await processOpenPayResponse();
                console.log('🆔 updatedOrderId:', updatedOrderId);
                
                // Obtener orderId de múltiples fuentes
                const urlParams = new URLSearchParams(window.location.search);
                let orderId = updatedOrderId || urlParams.get('order_id') || localStorage.getItem('currentOrderId');
                
                console.log('🔍 Buscando orderId en:', {
                    updatedOrderId,
                    urlOrderId: urlParams.get('order_id'),
                    localStorageCurrentOrderId: localStorage.getItem('currentOrderId'),
                    result: orderId
                });
                
                if (!orderId) {
                    const currentOrder = JSON.parse(localStorage.getItem('currentOrder') || 'null');
                    console.log('🔍 Buscando en currentOrder:', currentOrder);
                    orderId = currentOrder?.orderId;
                    console.log('🆔 orderId de currentOrder:', orderId);
                }
                
                if (!orderId) {
                    console.error('❌ No se encontró ID de pedido en ninguna fuente');
                    throw new Error('No se encontró ID de pedido');
                }
                
                console.log('✅ ID de pedido encontrado:', orderId);
                document.getElementById('order-id-display').textContent = `ID de tu pedido: ${orderId}`;
                
                // Obtener detalles de Firestore
                console.log('📋 Obteniendo detalles de Firestore para:', orderId);
                const orderDoc = await db.collection('orders').doc(orderId).get();
                
                if (!orderDoc.exists) {
                    console.log('⚠️ Orden no encontrada en Firestore, mostrando datos de localStorage');
                    return displayLocalStorageData(orderId);
                }
                
                const orderData = orderDoc.data();
                console.log('✅ Datos obtenidos de Firestore:', orderData);
                
                renderOrderDetails(orderData);
                
                // Registrar visualización
                if (auth.currentUser) {
                    console.log('👤 Usuario autenticado, registrando visualización');
                    await db.collection('orders').doc(orderId).update({
                        confirmation_viewed: true,
                        confirmation_viewed_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    console.log('👤 Usuario no autenticado');
                }
                
                // Limpiar localStorage solo después de confirmar que todo está bien
                cleanLocalStorage();
                
            } catch (error) {
                console.error('❌ Error en displayOrderDetails:', error);
                displayLocalStorageData();
            }
        }

        // Limpiar localStorage de forma segura
        function cleanLocalStorage() {
            console.log('=== 🧹 INICIANDO cleanLocalStorage ===');
            
            try {
                console.log('📋 Estado ANTES de limpiar:');
                console.log('- cart:', localStorage.getItem('cart') ? 'EXISTE' : 'NO EXISTE');
                console.log('- cartTotal:', localStorage.getItem('cartTotal'));
                console.log('- currentOrder:', localStorage.getItem('currentOrder') ? 'EXISTE' : 'NO EXISTE');
                console.log('- currentOrderId:', localStorage.getItem('currentOrderId'));
                
                // Guardar el orderId por si se necesita para futuras referencias
                const currentOrder = JSON.parse(localStorage.getItem('currentOrder') || 'null');
                if (currentOrder?.orderId) {
                    localStorage.setItem('lastOrderId', currentOrder.orderId);
                    console.log('💾 Guardado lastOrderId:', currentOrder.orderId);
                }
                
                // Eliminar solo los datos que ya no se necesitan
                localStorage.removeItem('cart');
                localStorage.removeItem('cartTotal');
                localStorage.removeItem('currentOrder');
                
                console.log('📋 Estado DESPUÉS de limpiar:');
                console.log('- cart:', localStorage.getItem('cart') ? 'NO SE LIMPIÓ' : '✅ LIMPIADO');
                console.log('- cartTotal:', localStorage.getItem('cartTotal') ? 'NO SE LIMPIÓ' : '✅ LIMPIADO');
                console.log('- currentOrder:', localStorage.getItem('currentOrder') ? 'NO SE LIMPIÓ' : '✅ LIMPIADO');
                console.log('- currentOrderId:', localStorage.getItem('currentOrderId'));
                console.log('- lastOrderId:', localStorage.getItem('lastOrderId'));
                
            } catch (e) {
                console.error('❌ Error limpiando localStorage:', e);
            }
        }

        // Renderizar detalles de Firestore
        function renderOrderDetails(orderData) {
            console.log('🎨 Renderizando detalles...', orderData);
            const orderDetails = document.getElementById('order-details');
            
            let detailsHTML = `
                <div class="detail-item">
                    <span class="detail-label">Estado:</span>
                    <span style="color: ${orderData.status === 'completed' ? 'var(--success)' : 'var(--primary)'}">
                        ${(orderData.status || 'pendiente').toUpperCase()}
                    </span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Estado de pago:</span>
                    <span style="color: ${orderData.payment_status === 'completed' ? 'var(--success)' : '#FF9800'}">
                        ${(orderData.payment_status || 'pendiente').toUpperCase()}
                    </span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Fecha:</span>
                    <span>${formatDate(orderData.created_at || new Date())}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Total:</span>
                    <span>$${(orderData.amount || 0).toFixed(2)} MXN</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Sucursal:</span>
                    <span>${orderData.branch || 'No especificada'}</span>
                </div>
            `;
            
            // Sección de productos
            if (orderData.items && orderData.items.length > 0) {
                console.log(`🛍️ Encontrados ${orderData.items.length} productos`);
                detailsHTML += `
                    <div class="products-section">
                        <h4>Productos (${orderData.items.length})</h4>
                `;
                
                orderData.items.forEach((item, index) => {
                    const quantity = item.quantity || 1;
                    const price = item.price || 0;
                    const total = price * quantity;
                    const productName = item.name || `Producto ${index + 1}`;
                    
                    detailsHTML += `
                        <div class="product-item">
                            <span class="product-name">${quantity} × ${productName}</span>
                            <span class="product-price">$${total.toFixed(2)}</span>
                        </div>
                    `;
                });
                
                detailsHTML += `</div>`;
            } else {
                console.log('⚠️ No se encontraron productos en la orden');
                detailsHTML += `
                    <div class="products-section">
                        <h4>Productos</h4>
                        <p style="color: #666; text-align: center;">No se encontraron productos en esta orden</p>
                    </div>
                `;
            }
            
            // ID de OpenPay si existe
            if (orderData.openpay_id) {
                detailsHTML += `
                    <div class="detail-item" style="margin-top: 20px;">
                        <span class="detail-label">ID de transacción:</span>
                        <span>${orderData.openpay_id}</span>
                    </div>
                `;
            }
            
            orderDetails.innerHTML = detailsHTML;
            console.log('✅ Detalles renderizados correctamente');
        }

        // Mostrar datos de localStorage
        function displayLocalStorageData(orderId = null) {
            console.log('🔄 Mostrando datos de localStorage como respaldo...');
            const currentOrder = JSON.parse(localStorage.getItem('currentOrder') || 'null');
            const orderDetails = document.getElementById('order-details');
            
            console.log('📋 currentOrder:', currentOrder);
            
            if (orderId) {
                document.getElementById('order-id-display').textContent = `ID de tu pedido: ${orderId}`;
            } else if (currentOrder?.orderId) {
                document.getElementById('order-id-display').textContent = `ID de tu pedido: ${currentOrder.orderId}`;
            }
            
            if (!currentOrder) {
                orderDetails.innerHTML = `
                    <p style="text-align: center; color: #666; padding: 20px;">
                        No se encontraron detalles del pedido. Por favor, revisa tu historial de compras.
                    </p>
                `;
                cleanLocalStorage();
                return;
            }
            
            let detailsHTML = `
                <div class="detail-item">
                    <span class="detail-label">Estado:</span>
                    <span>${currentOrder.status?.toUpperCase() || 'PENDIENTE'}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Total:</span>
                    <span>$${(currentOrder.amount || 0).toFixed(2)} MXN</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Sucursal:</span>
                    <span>${currentOrder.branch || 'No especificada'}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Nota:</span>
                    <span style="color: #666; font-style: italic">
                        Los detalles completos se actualizarán cuando el pago se confirme.
                    </span>
                </div>
            `;
            
            // Mostrar productos si existen
            if (currentOrder.items && currentOrder.items.length > 0) {
                console.log(`🛍️ Encontrados ${currentOrder.items.length} productos en currentOrder`);
                detailsHTML += `
                    <div class="products-section">
                        <h4>Productos (${currentOrder.items.length})</h4>
                `;
                
                currentOrder.items.forEach((item, index) => {
                    const quantity = item.quantity || 1;
                    const price = item.price || 0;
                    const total = price * quantity;
                    const productName = item.name || `Producto ${index + 1}`;
                    
                    detailsHTML += `
                        <div class="product-item">
                            <span class="product-name">${quantity} × ${productName}</span>
                            <span class="product-price">$${total.toFixed(2)}</span>
                        </div>
                    `;
                });
                
                detailsHTML += `</div>`;
            }
            
            orderDetails.innerHTML = detailsHTML;
            
            cleanLocalStorage();
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            console.log('=== 📄 DOM CARGADO ===');
            
            // Configurar botones
            const btnContinue = document.getElementById('btn-continue');
            const btnHistorial = document.getElementById('btn-historial');
            
            if (btnContinue) {
                btnContinue.addEventListener('click', () => {
                    console.log('🏠 Redirigiendo a inicio');
                    window.location.href = '../inicio-usuario/inicio-usuario.html';
                });
            } else {
                console.error('❌ No se encontró btn-continue');
            }
            
            if (btnHistorial) {
                btnHistorial.addEventListener('click', () => {
                    console.log('📜 Redirigiendo a historial');
                    window.location.href = '../historial-compras/historial-compras.html';
                });
            } else {
                console.error('❌ No se encontró btn-historial');
            }
            
            // Mostrar detalles de la orden
            console.log('🔄 Llamando a displayOrderDetails...');
            displayOrderDetails();
        });
    </script>
    <!-- NO cargar carritoUserLogin.js aquí -->
    <script src="/vista/nav-visitantes/recursosDinamicos/footer.js"></script>
    <script src="/vista/nav-mesa-operadores/js/guardar-ultima-pagina.js"></script>
</body>
</html>
